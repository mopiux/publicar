<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Evitar que el navegador guarde una copia vieja de la página -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">

<title>Taller de Reacciones</title>

<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* Layout: same family as Nomenclab — header + sticky tabs; one exercise card at a time (equation row, steps). */
:root{
  --bg:#EBF0EE; --surface:#FFFFFF; --surface-2:#F4F7F6; --ink:#13201E; --muted:#566663; --line:#D0DAD7;
  --accent:#0B7A6B; --accent-soft:#D3ECE6; --on-accent:#FFFFFF;
  --metal:#DCE7F3; --metal-ink:#1D4366; --nonmetal:#F7E3CC; --nonmetal-ink:#6C3810;
  --oxy:#C2412D; --hyd:#2C69AD; --flame:#D99400; --hint-soft:#FBF0D9;
  --good:#1B8549; --good-soft:#DBF1E3; --bad:#C23636; --bad-soft:#F8DFDE;
  --n-tr:#0B7A6B; --n-st:#6B47A8; --n-si:#B05A12;
  --shadow:0 1px 2px rgb(19 32 30 / .06), 0 8px 24px rgb(19 32 30 / .07);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1514; --surface:#16201E; --surface-2:#1B2725; --ink:#E4EDEB; --muted:#93A4A0; --line:#2A3735;
  --accent:#3CC2AC; --accent-soft:#173A35; --on-accent:#08201C;
  --metal:#1B2B3C; --metal-ink:#A8C9EA; --nonmetal:#352519; --nonmetal-ink:#F2C99D;
  --oxy:#F07B64; --hyd:#80B4EC; --flame:#F2BE3A; --hint-soft:#3A2E16;
  --good:#4FC27F; --good-soft:#163525; --bad:#F07575; --bad-soft:#3A1C1C;
  --n-tr:#3CC2AC; --n-st:#B497EA; --n-si:#EDA25F;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1514; --surface:#16201E; --surface-2:#1B2725; --ink:#E4EDEB; --muted:#93A4A0; --line:#2A3735;
  --accent:#3CC2AC; --accent-soft:#173A35; --on-accent:#08201C;
  --metal:#1B2B3C; --metal-ink:#A8C9EA; --nonmetal:#352519; --nonmetal-ink:#F2C99D;
  --oxy:#F07B64; --hyd:#80B4EC; --flame:#F2BE3A; --hint-soft:#3A2E16;
  --good:#4FC27F; --good-soft:#163525; --bad:#F07575; --bad-soft:#3A1C1C;
  --n-tr:#3CC2AC; --n-st:#B497EA; --n-si:#EDA25F;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
sub{font-size:.62em;vertical-align:-.28em;line-height:0}
.app{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
.top{display:flex;align-items:center;gap:14px;padding-block:20px 8px}
.logo{flex:none;width:52px;height:52px;border-radius:10px;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.25rem;position:relative}
.logo s{position:absolute;top:2px;right:5px;text-decoration:none;font-size:.7rem}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.8rem;letter-spacing:-.025em;margin:0;line-height:1}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:6px;padding-block:10px;background:var(--bg);overflow-x:auto}
.tab{flex:1 0 auto;font-family:var(--f-display);font-weight:700;font-size:.95rem;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hud{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin:6px 0 10px;font-size:.88rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-family:var(--f-display);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.pill.hot{color:var(--flame);border-color:var(--flame)}
.pill svg{width:14px;height:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:grid;gap:14px}
.consigna{margin:0;font-size:.95rem;color:var(--muted)}
.consigna b{color:var(--ink)}
.given{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.step{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface-2);display:grid;gap:10px;min-width:0}
.step.locked{opacity:.5;pointer-events:none}
.step.done{border-color:var(--good)}
.st-h{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700}
.st-n{width:24px;height:24px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:.8rem;flex:none}
.step.done .st-n{background:var(--good);color:var(--on-accent)}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:6px 6px;font-family:var(--f-display);font-weight:800;font-size:1.7rem;line-height:1.2}
.eq .sp{white-space:nowrap}
.eq .op{color:var(--muted);font-weight:500;padding-inline:2px}
.coef{width:46px;height:44px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.25rem;padding:0}
.prod{width:150px;max-width:100%;height:44px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px;font-size:1.1rem;font-family:var(--f-display);font-weight:700}
.coef:focus,.prod:focus,.nf input:focus{border-color:var(--accent);outline:none}
.coef.ok,.prod.ok{border-color:var(--good);background:var(--good-soft)}
.coef.bad,.prod.bad{border-color:var(--bad);background:var(--bad-soft)}
.prev{font-size:.88rem;color:var(--muted)}
.prev b{font-family:var(--f-display);font-size:1.2rem;color:var(--ink)}
.msg{font-size:.92rem;border-radius:10px;padding:8px 12px;background:var(--surface);border:1px solid var(--line)}
.msg.ok{border-color:var(--good);background:var(--good-soft)}
.msg.bad{border-color:var(--bad);background:var(--bad-soft)}
.msg.hint{border-color:var(--flame);background:var(--hint-soft)}
.msg p{margin:0} .msg p+p{margin-top:4px}
.count-wrap{overflow-x:auto}
.count{border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:260px;font-size:.95rem;background:var(--surface);border-radius:10px;overflow:hidden}
.count th,.count td{padding:6px 12px;border-bottom:1px solid var(--line);text-align:center}
.count th{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.count td:first-child{font-family:var(--f-display);font-weight:800;text-align:left}
.count .y{color:var(--good);font-weight:700} .count .n{color:var(--bad);font-weight:700}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;font-family:var(--f-display);font-size:.95rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.soft{border-color:var(--flame);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.names{display:grid;gap:8px}
.nf{display:grid;gap:4px;min-width:0}
.nf>span{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--c)}
.nf.tr{--c:var(--n-tr)} .nf.st{--c:var(--n-st)} .nf.si{--c:var(--n-si)}
.nf input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:16px}
.nf.ok input{border-color:var(--good);background:var(--good-soft)}
.nf.bad input{border-color:var(--bad);background:var(--bad-soft)}
.nf small{font-size:.85rem;color:var(--muted)}
.nf.ok small{color:var(--good)} .nf.bad small{color:var(--bad)}
.nf small b{color:var(--ink)}
.final{border-radius:14px;padding:12px 14px;background:var(--good-soft);border:1px solid var(--good);font-weight:700}
.sol{border-radius:14px;padding:12px 14px;background:var(--surface-2);border:1px dashed var(--line);display:grid;gap:6px;font-size:.95rem}
.sol .eqs{font-family:var(--f-display);font-weight:800;font-size:1.35rem}
.sol p{margin:0}

/* clasificar */
.cls-show{font-family:var(--f-display);font-weight:800;font-size:3.2rem;text-align:center;line-height:1.1;padding-block:8px}
.cls-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cls-btns .btn{padding:14px;font-size:1.1rem;border-radius:14px}
.cls-btns .btn.b1{border-color:var(--metal-ink)}
.cls-btns .btn.b2{border-color:var(--nonmetal-ink)}

/* machete */
.mach{display:grid;gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.box h3{margin:0 0 8px;font-family:var(--f-display);font-size:1.1rem}
.box p{margin:0 0 6px}
.box ol{margin:0;padding-left:20px;display:grid;gap:4px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700}
.flow .nd{border:2px solid var(--ink);border-radius:10px;padding:6px 12px;background:var(--surface-2)}
.flow .nd.m{background:var(--metal);color:var(--metal-ink);border-color:var(--metal-ink)}
.flow .nd.h{border-color:var(--accent);background:var(--accent-soft)}
.flow .ar{color:var(--muted);font-weight:500;font-size:.9rem}
.ex{font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.tsa{display:grid;gap:4px}
.tsa div{display:flex;gap:10px;flex-wrap:wrap}
.tsa b{width:118px;flex:none;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--c);padding-top:2px}
.toggles-row{display:flex;flex-wrap:wrap;gap:6px}
.tg{border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:700;font-size:.85rem;display:inline-flex;align-items:center;gap:6px}
.tg::before{content:"";width:12px;height:12px;border-radius:4px;border:2px solid var(--muted);flex:none}
.tg[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tg[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent)}
.ntag{display:inline-block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--c);border:1.5px solid var(--c);border-radius:999px;padding:2px 10px;justify-self:start}
.ntag.tr{--c:var(--n-tr)} .ntag.st{--c:var(--n-st)} .ntag.si{--c:var(--n-si)}
.nq-name{font-family:var(--f-display);font-weight:700;font-size:1.75rem;line-height:1.2;text-wrap:balance}
.gq-row input:disabled{opacity:.7}
footer{margin-top:36px;color:var(--muted);font-size:.85rem;max-width:70ch}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
/* sub-modos */
.subnav{display:flex;gap:4px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:3px;margin-bottom:12px}
.subnav button{flex:1;min-width:0;border:0;background:none;border-radius:999px;padding:7px 8px;cursor:pointer;font-weight:700;font-size:.9rem}
.subnav button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.nf.na input{border-style:dashed;color:var(--muted);background:var(--surface-2)}

/* números de oxidación */
.ox-layout{display:grid;gap:14px}
@media (min-width:760px){.ox-layout{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}}
.pt-wrap{overflow-x:auto;padding-bottom:2px}
.pt{display:grid;grid-template-columns:repeat(7,minmax(40px,1fr));gap:4px;min-width:300px}
.pt-h{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 2px;text-align:center;cursor:pointer;display:grid;gap:1px;line-height:1.15;min-width:0}
.pt-h b{font-family:var(--f-display);font-weight:800;font-size:.9rem}
.pt-h small{font-weight:700;font-size:.6rem;color:var(--hyd);overflow-wrap:anywhere}
.pt-h small.neg{color:var(--oxy)}
.pt-h[aria-pressed="true"]{border-color:var(--ink)}
.pt-c{aspect-ratio:1;max-width:100%;border-radius:8px;border:2px solid transparent;background:var(--metal);color:var(--metal-ink);font-family:var(--f-display);font-weight:800;font-size:1.05rem;cursor:pointer;display:grid;place-items:center;padding:0}
.pt-c.nm{background:var(--nonmetal);color:var(--nonmetal-ink)}
.pt-c[aria-pressed="true"]{border-color:var(--ink)}
.pt-e{aspect-ratio:1}
.tm{margin-top:12px;display:grid;gap:6px}
.tm-t{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.tm-row{display:flex;flex-wrap:wrap;gap:8px 16px}
.tm-g{display:flex;align-items:center;gap:4px}
.tm-g>span{font-size:.78rem;font-weight:700;color:var(--muted);margin-right:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tm-g .pt-c{width:38px;font-size:.95rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.legend .lm{background:var(--metal);box-shadow:inset 0 0 0 1px var(--metal-ink)}
.legend .ln{background:var(--nonmetal);box-shadow:inset 0 0 0 1px var(--nonmetal-ink)}
.det{display:grid;gap:12px;min-width:0}
.det-h{display:flex;gap:12px;align-items:center}
.big{flex:none;width:62px;height:62px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.8rem;background:var(--metal);color:var(--metal-ink)}
.big.nm{background:var(--nonmetal);color:var(--nonmetal-ink)}
.det-h h3{margin:0;font-family:var(--f-display);font-size:1.35rem;line-height:1.1}
.det-h p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.lbl{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:2px 10px;font-family:var(--f-display);font-weight:800;background:var(--surface-2);border:1.5px solid var(--line);font-variant-numeric:tabular-nums}
.chip.pos{border-color:var(--hyd);color:var(--hyd)}
.chip.neg{border-color:var(--oxy);color:var(--oxy)}
.note{margin:0;font-size:.92rem}
.rulebox{border-radius:12px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);font-size:.92rem}
.rulebox p{margin:0}
.ex-tbl{border-collapse:collapse;width:100%;font-size:.92rem}
.ex-tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.ex-tbl td:first-child{font-family:var(--f-display);font-weight:800;font-size:1.05rem;white-space:nowrap}
.ex-tbl td:nth-child(2){font-family:var(--f-display);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.trick ol{margin:0;padding-left:20px;display:grid;gap:6px}
.trick li b{font-family:var(--f-display)}
.gq-show{font-family:var(--f-display);font-weight:800;font-size:3rem;text-align:center;line-height:1.1;padding-block:4px}
.gq-show .big{margin:0 auto}
.gq-row{display:flex;gap:8px}
.gq-row input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:16px}
.gq-row input:focus{border-color:var(--accent);outline:none}
.gq-btns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.gq-btns .btn{padding:10px 4px;border-radius:12px}
.gq-btns .btn.good{border-color:var(--good);background:var(--good-soft)}
.gq-btns .btn.bad{border-color:var(--bad);background:var(--bad-soft)}
footer{margin-top:36px;color:var(--muted);font-size:.85rem;max-width:70ch}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="logo" aria-hidden="true">OH<s>−</s></div>
    <div class="brand">
      <h1>Taller de Reacciones</h1>
      <p>Hidróxidos, hidruros y sales binarias: armá el producto, balanceá y nombrá con T, S y A</p>
    </div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Secciones">
    <button class="tab" role="tab" data-v="nombres" aria-selected="false">Nombre y fórmula</button>
    <button class="tab" role="tab" data-v="hidroxidos" aria-selected="false">Hidróxidos</button>
    <button class="tab" role="tab" data-v="hidruros" aria-selected="false">Hidruros</button>
    <button class="tab" role="tab" data-v="sales" aria-selected="false">Sales binarias</button>
    <button class="tab" role="tab" data-v="clas" aria-selected="false">¿Básico o ácido?</button>
  </nav>
  <div class="hud"><span class="pill" id="stkP" title="Ejercicios seguidos sin ver la solución"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3.5 5 5.5 5 11a5 5 0 0 1-10 0c0-2.4 1-4 2.3-5.2.2 1.7.9 2.9 2 3.4C11 8.6 11.2 5 12 2z"/></svg><span id="stk">0</span></span><span class="pill"><span id="done">0</span>&nbsp;resueltos</span></div>
  <div id="sub"></div>
  <main id="main"></main>
  <footer>Armado según el cuaderno: nomenclaturas T (tradicional), S (Stock) y A (atomicidad). Se aceptan mayúsculas, minúsculas y nombres sin tilde, pero te avisa.</footer>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
/* ===== utilidades ===== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>b?gcd(b,a%b):a;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('taller:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('taller:'+k,JSON.stringify(v))}catch(e){}}};
const reduceMotion=()=>!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const strip=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const compact=s=>strip(String(s).toLowerCase()).replace(/[^a-z0-9]/g,'');
const accentKey=s=>String(s).toLowerCase().normalize('NFC').replace(/[^a-záéíóúüñ0-9]/g,'');
const subNorm=s=>s.replace(/[₀-₉]/g,d=>'₀₁₂₃₄₅₆₇₈₉'.indexOf(d)).replace(/\s+/g,'');
const looksFormula=s=>{const t=s.trim();return t.length>0&&!/\s/.test(t)&&/[0-9₀-₉()]/.test(t)&&t.length<14};
const ROM=['','I','II','III','IV','V','VI','VII'];
const PRE=['','mono','di','tri','tetra','penta','hexa','hepta','octa','nona','deca'];
const OXW={1:'monóxido',2:'dióxido',3:'trióxido',4:'tetróxido',5:'pentóxido',6:'hexóxido',7:'heptóxido'};
const fmtOx=v=>v>0?'+'+v:'−'+Math.abs(v);
const fmtF=f=>f.replace(/(\d+)/g,'<sub>$1</sub>');
const listY=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' y '+a[a.length-1];

/* ===== datos ===== */
const METALS=[
 ['Li','litio',[1]],['Na','sodio',[1]],['K','potasio',[1]],['Ag','plata',[1],null,'la'],
 ['Be','berilio',[2]],['Mg','magnesio',[2]],['Ca','calcio',[2]],['Ba','bario',[2]],['Zn','zinc',[2]],['Al','aluminio',[3]],
 ['Cu','cobre',[1,2],['cuproso','cúprico']],['Hg','mercurio',[1,2],['mercurioso','mercúrico']],
 ['Au','oro',[1,3],['auroso','áurico']],['Fe','hierro',[2,3],['ferroso','férrico']],
 ['Co','cobalto',[2,3],['cobaltoso','cobáltico']],['Ni','níquel',[2,3],['niqueloso','niquélico']],
 ['Cr','cromo',[2,3],['cromoso','crómico']],['Mn','manganeso',[2,3],['manganoso','mangánico']],
 ['Sn','estaño',[2,4],['estañoso','estánnico']],['Pb','plomo',[2,4],['plumboso','plúmbico']],
 ['Bi','bismuto',[3,5],['bismutoso','bismútico']],
].map(([sym,n,ox,tr,art])=>({sym,n,ox,tr,art:art||'el',metal:true}));
const EL={};METALS.forEach(e=>EL[e.sym]=e);
const NM={
 C:{n:'carbono',ox:[2,4],neg:4,trH:'metano'},
 Si:{n:'silicio',ox:[4],neg:4,trH:'silano'},
 N:{n:'nitrógeno',ox:[3,5],neg:3,trH:'amoníaco',diat:1},
 P:{n:'fósforo',ox:[3,5],neg:3,trH:'fosfina'},
 As:{n:'arsénico',ox:[3,5],neg:3,trH:'arsina'},
 S:{n:'azufre',ox:[2,4,6],neg:2,uro:'sulfuro',hid:'sulfhídrico'},
 Se:{n:'selenio',ox:[2,4,6],neg:2,uro:'seleniuro',hid:'selenhídrico'},
 Te:{n:'teluro',ox:[2,4,6],neg:2,uro:'telururo',hid:'telurhídrico'},
 Cl:{n:'cloro',ox:[1,3,5,7],neg:1,uro:'cloruro',hid:'clorhídrico',diat:1},
 Br:{n:'bromo',ox:[1,3,5,7],neg:1,uro:'bromuro',hid:'bromhídrico',diat:1},
 I:{n:'yodo',ox:[1,3,5,7],neg:1,uro:'yoduro',hid:'yodhídrico',diat:1},
};
Object.entries(NM).forEach(([s,x])=>{x.sym=s;x.art='el';x.metal=false});
const SALT_X=['Cl','Br','I','S','Se','Te'];
const GROUP={H:1,Li:1,Na:1,K:1,Be:2,Mg:2,Ca:2,Ba:2,Al:13,C:14,Si:14,Sn:14,Pb:14,N:15,P:15,As:15,Bi:15,O:16,S:16,Se:16,Te:16,F:17,Cl:17,Br:17,I:17};
const del=e=>e.art==='la'?'de la':'del';
const fHTML=p=>p.map(x=>x.g?(x.n>1?`(${x.g})<sub>${x.n}</sub>`:x.g):`${x.s}${x.n>1?`<sub>${x.n}</sub>`:''}`).join('');
const fKey=p=>p.map(x=>x.g?(x.n>1?`(${x.g})${x.n}`:x.g):`${x.s}${x.n>1?x.n:''}`).join('');

/* ===== conteo y balanceo ===== */
function parseFormula(str){
  const s=subNorm(str);let i=0;
  const num=()=>{let d='';while(i<s.length&&/\d/.test(s[i]))d+=s[i++];return d?+d:1};
  function group(){const c={};
    while(i<s.length){const ch=s[i];
      if(ch==='('){i++;const g=group();if(s[i]!==')')throw 0;i++;const n=num();for(const k in g)c[k]=(c[k]||0)+g[k]*n}
      else if(ch===')')break;
      else if(/[A-Z]/.test(ch)){let sym=ch;i++;if(i<s.length&&/[a-z]/.test(s[i])){sym+=s[i];i++}const n=num();c[sym]=(c[sym]||0)+n}
      else throw 0;}
    return c}
  try{const c=group();if(i!==s.length||!Object.keys(c).length)return null;return c}catch(e){return null}
}
function tally(fs,coefs){const t={};fs.forEach((f,i)=>{const c=parseFormula(f)||{};for(const k in c)t[k]=(t[k]||0)+c[k]*coefs[i]});return t}
function balance(fs,nR){
  const comps=fs.map(parseFormula),els=[...new Set(comps.flatMap(c=>Object.keys(c)))],n=fs.length,co=new Array(n).fill(1);let found=null;
  const ok=()=>els.every(k=>{let s=0;for(let i=0;i<n;i++)s+=(i<nR?1:-1)*co[i]*(comps[i][k]||0);return s===0});
  (function rec(i){if(found)return;if(i===n){if(ok())found=co.slice();return}for(let k=1;k<=12&&!found;k++){co[i]=k;rec(i+1)}})(0);
  return found;
}

/* ===== compuestos ===== */
const TW={oxido:'óxido',hidroxido:'hidróxido',hidM:'hidruro'};
const metalTr=(e,v,w)=>e.ox.length===1?`${w} de ${e.n}`:`${w} ${e.tr[e.ox.indexOf(v)]}`;
function names(c){
  const e=c.e;
  if(c.tipo==='oxido')return {tr:metalTr(e,c.v,'óxido'),st:`óxido de ${e.n} (${ROM[c.v]})`,si:`${OXW[c.b]} de ${c.a>1?PRE[c.a]:''}${e.n}`};
  if(c.tipo==='hidroxido')return {tr:metalTr(e,c.v,'hidróxido'),st:`hidróxido de ${e.n} (${ROM[c.v]})`,si:`${c.v>1?PRE[c.v]:''}hidróxido de ${e.n}`};
  if(c.tipo==='hidM')return {tr:metalTr(e,c.v,'hidruro'),st:`hidruro de ${e.n} (${ROM[c.v]})`,si:`${c.v>1?PRE[c.v]:''}hidruro de ${e.n}`};
  if(c.tipo==='hidNM')return c.special?{tr:c.x.trH,st:null,si:`${PRE[c.h]}hidruro de ${c.x.n}`}:{tr:`ácido ${c.x.hid}`,st:null,si:`${c.x.uro} de ${c.h>1?PRE[c.h]:''}hidrógeno`};
  const x=c.x;
  return {tr:metalTr(e,c.v,x.uro),st:`${x.uro} de ${e.n} (${ROM[c.v]})`,si:`${c.q>1?PRE[c.q]:''}${x.uro} de ${c.p>1?PRE[c.p]:''}${e.n}`};
}
const fin=c=>{c.key=[c.tipo,c.e.sym,c.v,c.x?c.x.sym:''].join('|');if(c.e.metal||c.tipo==='hidNM')c.names=names(c);return c};
function oxideOf(e,v){let a=2,b=v;const g=gcd(a,b);a/=g;b/=g;return fin({tipo:'oxido',e,v,a,b,g,parts:[{s:e.sym,n:a},{s:'O',n:b}]})}
function hydroxOf(e,v){return fin({tipo:'hidroxido',e,v,parts:[{s:e.sym,n:1},{g:'OH',n:v}]})}
function hidMOf(e,v){return fin({tipo:'hidM',e,v,parts:[{s:e.sym,n:1},{s:'H',n:v}]})}
function hidNMOf(x){const h=x.neg,hf=!!x.uro;return fin({tipo:'hidNM',x,e:x,v:-h,h,hFirst:hf,special:!x.uro,parts:hf?[{s:'H',n:h},{s:x.sym,n:1}]:[{s:x.sym,n:1},{s:'H',n:h}]})}
function saltOf(e,v,x){const w=x.neg,g=gcd(v,w),p=w/g,q=v/g;return fin({tipo:'sal',e,v,x,w,g,p,q,parts:[{s:e.sym,n:p},{s:x.sym,n:q}]})}
const ALL=[];
METALS.forEach(e=>e.ox.forEach(v=>{ALL.push(oxideOf(e,v),hydroxOf(e,v),hidMOf(e,v));SALT_X.forEach(s=>ALL.push(saltOf(e,v,NM[s])))}));
Object.values(NM).forEach(x=>ALL.push(hidNMOf(x)));

/* ===== corrección de nombres ===== */
function alts(c,nom){
  const base=c.names[nom];if(!base)return [];const A=[{s:base}],e=c.e;
  if(nom==='st'&&c.tipo!=='hidNM'&&e.ox.length===1)A.push({s:base.replace(/ \([IVX]+\)$/,''),note:`También está bien sin el número. En tu carpeta lo escriben con (${ROM[c.v]}).`});
  if(nom==='tr'){
    if(e.sym==='Sn'&&c.v===4)A.push({s:base.replace('estánnico','estánico')});
    if(c.tipo==='hidNM'){
      if(c.x.sym==='N')A.push({s:'amoniaco'});if(c.x.sym==='P')A.push({s:'fosfano'});if(c.x.sym==='As')A.push({s:'arsano'});
      if(!c.special){const note=`Así se llama como gas (g). Disuelto en agua (ac) es «${base}».`;A.push({s:c.names.si.replace('dihidrógeno','hidrógeno'),note});if(c.h>1)A.push({s:c.names.si,note})}
    }
  }
  if(nom==='si'){
    if(c.tipo==='oxido'){const L={4:'tetraóxido',5:'pentaóxido'};if(L[c.b])A.push({s:base.replace(OXW[c.b],L[c.b])});if(c.b===1&&c.a>1)A.push({s:base.replace('monóxido','óxido')})}
    if((c.tipo==='hidroxido'||c.tipo==='hidM')&&c.v===1)A.push({s:'mono'+base});
    if(c.tipo==='hidNM'&&!c.special&&c.h===2)A.push({s:base.replace('dihidrógeno','hidrógeno')});
    if(c.tipo==='sal'&&c.q===1)A.push({s:'mono'+base});
  }
  return A;
}
const NOMLBL={tr:'T (tradicional)',st:'S (Stock)',si:'A (atomicidad)'};
const UN={oxido:'un óxido',hidroxido:'un hidróxido',hidM:'un hidruro',hidNM:'un hidruro',sal:'una sal binaria'};
const wordOf=c=>c.tipo==='sal'?c.x.uro:TW[c.tipo];
function diffMsg(c,x){
  const e=c.e;
  if(x.e.sym===e.sym&&x.tipo===c.tipo&&(!c.x||x.x.sym===c.x.sym))return `Ese es con ${fmtOx(x.v)}. Acá ${e.art} ${e.n} actúa con <b>${fmtOx(c.v)}</b>.`;
  if(c.tipo==='sal'&&x.tipo==='sal'&&x.e.sym===e.sym)return `Ese nombre es con otro no metal (${x.x.n}). Acá es ${c.x.n}: <b>${c.x.uro}</b>.`;
  if(x.tipo!==c.tipo&&!(x.tipo.startsWith('hid')&&c.tipo.startsWith('hid')&&x.tipo!=='hidroxido'&&c.tipo!=='hidroxido'))return `Ese nombre es de ${UN[x.tipo]}. Esto es <b>${UN[c.tipo]}</b>.`;
  return 'Ese nombre es de otro elemento.';
}
function checkName(c,nom,input){
  const u=compact(input);if(!u)return {empty:true};
  for(const a of alts(c,nom))if(compact(a.s)===u){
    const notes=[];if(a.note)notes.push(a.note);else if(accentKey(input)!==accentKey(a.s))notes.push(`Ojo con las tildes: «${a.s}».`);
    if(nom==='st'&&/\s[ivx]+\s*$/i.test(input.trim()))notes.push('El romano va entre paréntesis.');
    return {ok:true,notes};
  }
  const e=c.e;let d='';
  if(looksFormula(input))d='Acá va el nombre, no la fórmula.';
  if(!d)for(const o of ['tr','st','si'])if(o!==nom&&alts(c,o).some(a=>compact(a.s)===u)){d=`Ese nombre está bien, pero es la ${NOMLBL[o]}.`;break}
  if(!d)for(const x of ALL){if(x.key===c.key)continue;if(['tr','st','si'].some(o=>alts(x,o).some(a=>compact(a.s)===u))){d=diffMsg(c,x);break}}
  if(!d&&nom==='st'&&c.names.st){
    const m=input.match(/\d+/);
    if(m)d=`En Stock el número va en romanos: (${ROM[+m[0]]||'?'}).`;
    else{const r=input.toLowerCase().match(/\(?\s*([ivx]+)\s*\)?\s*$/);if(r){const val=ROM.indexOf(r[1].toUpperCase());if(val>0&&val!==c.v)d=`El romano no es ese: acá ${e.art} ${e.n} actúa con +${c.v} → (${ROM[c.v]}).`}}
    if(!d&&e.ox.length>1&&u===compact(`${wordOf(c)} de ${e.n}`))d=`Falta el número en romanos: ${e.art} ${e.n} tiene más de uno.`;
  }
  if(!d&&nom==='tr'&&c.tipo!=='hidNM'){
    const w=wordOf(c);
    if(e.ox.length>1&&u===compact(`${w} de ${e.n}`))d=`${cap(e.art)} ${e.n} tiene dos números: se usa -oso (el menor) o -ico (el mayor).`;
    else if(e.ox.length===1&&/(oso|ico)$/.test(u))d=`${cap(e.art)} ${e.n} tiene un solo número, así que no lleva -oso ni -ico: «${w} de ${e.n}».`;
  }
  if(!d&&c.tipo==='sal'&&!u.startsWith(compact(c.x.uro))&&!u.startsWith(compact(PRE[c.q]+c.x.uro)))d=`El nombre empieza por el no metal terminado en -uro: <b>${c.x.uro}</b>.`;
  if(!d&&nom==='si')d='Contá los átomos de la fórmula y usá los prefijos di, tri, tetra…';
  return {ok:false,diag:d};
}

/* ===== corrección de fórmulas ===== */
function wrongs(c){
  const V=[],ck=fKey(c.parts).toLowerCase(),e=c.e;
  const add=(p,m)=>{const k=fKey(p).toLowerCase();if(k!==ck&&!V.some(v=>v[0]===k))V.push([k,m])};
  if(c.tipo==='hidroxido'){
    if(c.v>1)add([{s:e.sym,n:1},{s:'OH',n:c.v}],`Faltan los paréntesis: con más de un OH se escribe (OH)<sub>${c.v}</sub>.`);
    const ox=oxideOf(e,c.v);add(ox.parts,'Ese es el óxido. El producto con agua es el <b>hidróxido</b>: metal + OH.');
    if(ox.a>1){const m=`El hidróxido lleva <b>un solo</b> átomo de metal. Los ${ox.a} que hay en el óxido se arreglan con el coeficiente (el número de adelante).`;add([{s:e.sym,n:ox.a},{g:'OH',n:c.v}],m);add([{s:e.sym,n:ox.a},{g:'OH',n:c.v*ox.a}],m)}
    e.ox.filter(w=>w!==c.v).forEach(w=>add(hydroxOf(e,w).parts,`Ese sería con ${fmtOx(w)}. Fijate en el óxido: acá ${e.art} ${e.n} actúa con <b>${fmtOx(c.v)}</b>.`));
    add([{s:e.sym,n:1},{s:'H',n:c.v}],'Eso es un hidruro. El hidróxido lleva el grupo OH.');
  } else if(c.tipo==='oxido'){
    if(c.a!==c.b)add([{s:e.sym,n:c.b},{s:'O',n:c.a}],'Invertiste los subíndices: el número de cada uno baja <b>al otro</b>.');
    if(c.g>1)add([{s:e.sym,n:2},{s:'O',n:c.v}],`Cruzaste bien pero falta simplificar: dividí por ${c.g}.`);
    add([{s:e.sym,n:1},{s:'O',n:2}],'El O<sub>2</sub> es como viene el oxígeno solo. En el óxido se cruzan los números de oxidación.');
    e.ox.filter(w=>w!==c.v).forEach(w=>add(oxideOf(e,w).parts,`Ese sería con ${fmtOx(w)}. Acá ${e.art} ${e.n} actúa con <b>${fmtOx(c.v)}</b>.`));
  } else if(c.tipo==='hidM'){
    add([{s:'H',n:c.v},{s:e.sym,n:1}],'En los hidruros metálicos se escribe primero el metal y después el H.');
    if(c.v>1)add([{s:e.sym,n:c.v},{s:'H',n:1}],`Al revés: el ${e.sym} queda con 1 y el hidrógeno con ${c.v} (el número del metal).`);
    add([{s:e.sym,n:1},{s:'H',n:2}],`No se copia el 2 del H<sub>2</sub>: el subíndice del H es el número de oxidación del metal (+${c.v}).`);
    e.ox.filter(w=>w!==c.v).forEach(w=>add(hidMOf(e,w).parts,`Ese sería con ${fmtOx(w)}. Acá ${e.art} ${e.n} actúa con <b>${fmtOx(c.v)}</b>.`));
    add([{s:e.sym,n:1},{g:'OH',n:c.v}],'Eso es un hidróxido. El hidruro es solo metal + H.');
  } else if(c.tipo==='hidNM'){
    const x=c.x,ord=n=>c.hFirst?[{s:'H',n},{s:x.sym,n:1}]:[{s:x.sym,n:1},{s:'H',n}];
    add(c.hFirst?[{s:x.sym,n:1},{s:'H',n:c.h}]:[{s:'H',n:c.h},{s:x.sym,n:1}],c.hFirst?'En este caso se escribe primero el hidrógeno.':`En este caso se escribe primero el ${x.n}.`);
    x.ox.forEach(p=>add(ord(p),`Con hidrógeno, el ${x.n} usa su número <b>negativo</b> (−${c.h}), no los positivos. Por eso lleva ${c.h} H.`));
    if(x.diat){
      add(c.hFirst?[{s:'H',n:2*c.h},{s:x.sym,n:2}]:[{s:x.sym,n:2},{s:'H',n:2*c.h}],`No se copia el 2 de ${x.sym}<sub>2</sub>: queda ${fHTML(c.parts)} y el 2 se arregla con el coeficiente.`);
      add(c.hFirst?[{s:'H',n:2},{s:x.sym,n:2}]:[{s:x.sym,n:2},{s:'H',n:2}],`No se copian los subíndices de H<sub>2</sub> y ${x.sym}<sub>2</sub>: se cruzan los números de oxidación (H +1, ${x.sym} −${c.h}).`);
    }
  } else if(c.tipo==='sal'){
    const x=c.x;
    if(c.p!==c.q)add([{s:e.sym,n:c.q},{s:x.sym,n:c.p}],'Invertiste los subíndices: el número de cada uno baja como subíndice <b>del otro</b>.');
    if(c.g>1)add([{s:e.sym,n:c.w},{s:x.sym,n:c.v}],`Cruzaste bien, pero falta simplificar: dividí los dos subíndices por ${c.g}.`);
    if(x.diat)add([{s:e.sym,n:1},{s:x.sym,n:2}],`No se copia el 2 de ${x.sym}<sub>2</sub>: en la sal se cruzan los números (${e.sym} +${c.v}, ${x.sym} −${c.w}).`);
    add([{s:x.sym,n:c.q},{s:e.sym,n:c.p}],'En las sales binarias se escribe primero el metal y después el no metal.');
    e.ox.filter(w=>w!==c.v).forEach(w=>add(saltOf(e,w,x).parts,`Ese sería con ${fmtOx(w)}. Acá ${e.art} ${e.n} actúa con <b>${fmtOx(c.v)}</b>.`));
    x.ox.forEach(p=>add(saltOf(e,c.v,{...x,neg:p}).parts,`En una sal binaria el no metal usa su número <b>negativo</b> (−${c.w}), no los positivos.`));
    add(oxideOf(e,c.v).parts,'Eso es el óxido. La sal binaria es metal + no metal, sin oxígeno.');
  }
  return V;
}
function checkProduct(c,input){
  if(!input.trim())return {empty:true};
  const raw=subNorm(input).replace(/([A-Za-z)])1(?!\d)/g,'$1'),key=fKey(c.parts);
  if(raw===key)return {ok:true,notes:[]};
  if(raw.toLowerCase()===key.toLowerCase())return {ok:true,notes:[`Ojo con las mayúsculas: se escribe ${fHTML(c.parts)}.`]};
  const hit=wrongs(c).find(w=>w[0]===raw.toLowerCase());if(hit)return {ok:false,diag:hit[1]};
  const got=parseFormula(input);if(!got)return {ok:false,diag:'No entiendo esa fórmula. Escribí cada símbolo empezando con mayúscula, por ejemplo Fe(OH)3.'};
  const want=parseFormula(key);
  if(c.tipo==='sal'&&got.O)return {ok:false,diag:'Las sales binarias no tienen oxígeno: son solo metal y no metal.'};
  if(c.tipo==='sal'&&got.H)return {ok:false,diag:'La sal no lleva hidrógeno: el H del ácido se junta con el OH y forma el agua.'};
  const miss=Object.keys(want).filter(k=>!got[k]),extra=Object.keys(got).filter(k=>!want[k]);
  if(miss.length||extra.length)return {ok:false,diag:`${miss.length?`Falta: ${miss.join(', ')}. `:''}${extra.length?`Sobra: ${extra.join(', ')}.`:''}`};
  return {ok:false,diag:'Están los elementos correctos, pero los subíndices no. Cruzá los números de oxidación (sin el signo) y simplificá si se puede.'};
}

/* ===== reacciones ===== */
const sp=(f,html)=>({f,html:html||fmtF(f)});
const un=c=>({unk:c,f:fKey(c.parts),html:fHTML(c.parts)});
const elemSp=x=>x.diat?sp(x.sym+'2'):sp(x.sym);
function R(kind,species,ctx){const fs=species.map(s=>s.f);return {kind,species,nR:2,fs,coefs:balance(fs,2),ctx:ctx||{}}}
function rxWater(e,v){const ox=oxideOf(e,v);return R('agua',[sp(fKey(ox.parts),fHTML(ox.parts)),sp('H2O'),un(hydroxOf(e,v))],{ox})}
function rxMetalO2(e,v){return R('metalO2',[sp(e.sym),sp('O2'),un(oxideOf(e,v))])}
function rxHidM(e,v){return R('hidM',[sp(e.sym),sp('H2'),un(hidMOf(e,v))])}
function rxHidNM(x){return R('hidNM',[elemSp(x),sp('H2'),un(hidNMOf(x))])}
function rxSalt(e,v,x){return R('sal',[sp(e.sym),elemSp(x),un(saltOf(e,v,x))])}
function rxNeutral(e,v,x){const hy=hydroxOf(e,v),ac=hidNMOf(x);return R('neutral',[sp(fKey(hy.parts),fHTML(hy.parts)),sp(fKey(ac.parts),fHTML(ac.parts)),un(saltOf(e,v,x)),sp('H2O')])}
const STEPT={agua:'Óxido básico + agua → hidróxido',metalO2:'Metal + oxígeno → óxido básico',hidM:'Metal + hidrógeno → hidruro metálico',hidNM:'No metal + hidrógeno → hidruro no metálico',sal:'Metal + no metal → sal binaria',neutral:'Hidróxido + hidrácido → sal binaria + agua'};

  if(nom==='si'){h.push('En atomicidad los prefijos te dicen cuántos átomos hay de cada uno (di 2, tri 3, tetra 4, penta 5).');h.push(`Hay que escribir: ${c.parts.map(p=>p.g?'OH':p.s).join(' y ')}${c.tipo==='hidNM'&&c.hFirst?' (el H va primero)':''}.`);return h}
  if(c.tipo==='hidNM'){if(c.special)h.push(`${cap(c.names.tr)} es el hidruro del ${c.x.n}.`);h.push(nmLine(c.x));h.push(crossLine(c));return h}
  h.push(metalLine(c,nom));
  if(c.tipo==='sal')h.push(`${cap(c.x.uro)} viene del ${c.x.n}. ${nmLine(c.x)}`);
  h.push(crossLine(c));
  return h;
}
function fnRule(c,nom){
  const e=c.e,uro=c.tipo==='sal'?`El no metal termina en -uro (${c.x.n} → ${c.x.uro}). `:'';
  if(c.tipo==='hidNM'){if(nom==='tr')return c.special?'Este hidruro tiene un nombre propio que se memoriza.':'Disuelto en agua se nombra «ácido» + raíz del no metal + «-hídrico».';return 'No metal terminado en -uro (o «hidruro de» para C, Si, N, P, As) y prefijo según la cantidad de H.'}
  if(nom==='st')return `${uro}Va «de» + metal y el número de oxidación del metal en romanos entre paréntesis.`;
  if(nom==='si')return `${uro}Usá prefijos según la cantidad de átomos (di 2, tri 3, tetra 4, penta 5). Un solo átomo de metal no lleva prefijo.`;
  return uro+(e.ox.length===1?`${cap(e.art)} ${e.n} tiene un solo número: se dice «… de ${e.n}».`:`${cap(e.art)} ${e.n} usa -oso con +${e.ox[0]} y -ico con +${e.ox[1]}.`);
}
function fnHints(c,nom){
  const nm=c.names[nom],ws=nm.split(' ');
  const start=ws.length>1?`${ws[0]} ${ws[1].slice(0,Math.min(2,ws[1].length))}…`:nm.slice(0,Math.ceil(nm.length/2))+'…';
  return [typeLine(c),nom==='si'?`Contá los átomos de cada elemento en la fórmula.`:`Sacá los números de oxidación: ${fromFormula(c)}`,fnRule(c,nom),`Empieza así: «${start}»`];
}
function pickCompound(dir){
  const ts=NTYPES.map(t=>t[0]).filter(t=>NT[t]);if(!ts.length)return null;
  for(let k=0;k<50;k++){
    const t=rnd(ts),pool=ALL.filter(c=>typeOf(c)===t),c=rnd(pool),noms=['tr','st','si'].filter(n=>c.names[n]);
    if(NQ&&NQ.c.key===c.key)continue;
    return {c,nom:rnd(noms)};
  }
  return null;
}
function newNombre(){
  const dir=SUB.nombres,pk=pickCompound(dir);
  const toggles=`<div class="toggles-row">${NTYPES.map(([k,l])=>`<button class="tg" data-nt="${k}" aria-pressed="${!!NT[k]}">${l}</button>`).join('')}</div>`;
  if(!pk){$('#main').innerHTML=`<div class="card">${toggles}<p class="consigna">Elegí al menos un tipo de compuesto.</p></div>`;return}
  NQ={...pk,dir,hints:0,done:false,missed:false};
  const c=NQ.c,nom=NQ.nom;
  const ask=dir==='nf'
    ?`<p class="consigna">Escribí la <b>fórmula</b> de:</p><span class="ntag ${nom}">${NOMTAG[nom]}</span><div class="nq-name">${c.names[nom]}</div>`
    :`<p class="consigna">Escribí el <b>nombre</b> en <span class="ntag ${nom}">${NOMTAG[nom]}</span></p><div class="gq-show">${fHTML(c.parts)}</div>`;
  $('#main').innerHTML=`<div class="card">${toggles}${ask}
   <div class="gq-row"><input id="nq-in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${dir==='nf'?'Escribí la fórmula':'Escribí el nombre'}" aria-label="Tu respuesta"><button class="btn primary" data-a="nqcheck">Comprobar</button></div>
   <span class="prev" id="nq-prev" hidden></span>
   <div id="nq-out"></div>
   <div class="btns" id="nq-btns"><button class="btn" data-a="nqshow">Ver solución</button><button class="btn" data-a="nqnext">Otro</button></div>
   <p class="consigna">Seguidas: <b id="nq-stk">${nStreak}</b></p></div>`;
  const inp=$('#nq-in');if(inp&&!reduceMotion())inp.focus({preventScroll:true});
}
function nqExplain(){
  const c=NQ.c;
  return `<div class="sol"><span class="eqs">${fHTML(c.parts)}</span>
    <p>${typeLine(c)} ${NQ.dir==='nf'&&!(c.tipo==='hidNM')?metalLine(c,NQ.nom==='si'?'tr':NQ.nom):fromFormula(c)}${c.tipo==='sal'&&NQ.dir==='nf'?' '+nmLine(c.x):''}</p>
    <p>${crossLine(c)}</p>
    <div class="tsa">${NOMS.map(([k,l])=>`<div style="--c:var(--n-${k})"><b>${l}</b>${c.names[k]||'no se usa'}</div>`).join('')}</div></div>`;
}
function nqFinish(clean,head){
  NQ.done=true;
  if(clean){nStreak++;solved(true)}else{nStreak=0;solved(false)}
  $('#nq-stk').textContent=nStreak;
  $('#nq-out').innerHTML=`${head}${nqExplain()}`;
  $('#nq-in').disabled=true;$$('#nq-btns [data-a="nqhint"], #nq-btns [data-a="nqshow"]').forEach(b=>b.disabled=true);
  const nx=$('#nq-btns [data-a="nqnext"]');nx.classList.add('primary');nx.textContent='Siguiente';nx.focus({preventScroll:true});
}
function nqCheck(){
  if(NQ.done)return;const v=$('#nq-in').value,c=NQ.c;
  const r=NQ.dir==='nf'?checkProduct(c,v):checkName(c,NQ.nom,v);
  if(r.empty){$('#nq-out').innerHTML='<div class="msg bad"><p>Escribí tu respuesta primero.</p></div>';return}
  if(r.ok){nqFinish(!NQ.missed&&!NQ.hints,`<div class="msg ok"><p><b>${rnd(['¡Bien!','¡Exacto!','¡Eso es!','¡Perfecto!'])}</b>${r.notes.length?' '+r.notes.join(' '):''}</p></div>`);return}
  NQ.missed=true;nStreak=0;$('#nq-stk').textContent=0;
  $('#nq-out').innerHTML=`<div class="msg bad"><p><b>No es correcto.</b> ${r.diag||(NQ.dir==='nf'?'Revisá los números de oxidación y el cruce.':'Revisá la regla de esta nomenclatura.')}</p><p>Corregilo y volvé a comprobar.</p></div>`;
}
function nqHint(){
  if(NQ.done)return;const list=NQ.dir==='nf'?nfHints(NQ.c,NQ.nom):fnHints(NQ.c,NQ.nom);
  if(NQ.hints>=list.length){$('#nq-out').innerHTML='<div class="msg hint"><p>No hay más pistas. Tocá «Ver solución» si no sale.</p></div>';return}
  NQ.hints++;$('#nq-out').innerHTML=`<div class="msg hint">${list.slice(0,NQ.hints).map((t,i)=>`<p><b>Pista ${i+1}:</b> ${t}</p>`).join('')}</div>`;
}

/* ===== clasificar ===== */
let CL=null,clStreak=0;
function newClas(){
  const pool=[];
  METALS.forEach(e=>e.ox.forEach(v=>pool.push({f:fHTML(oxideOf(e,v).parts),t:'b',sym:e.sym})));
  Object.values(NM).forEach(x=>x.ox.forEach(v=>pool.push({f:fHTML(oxideOf(x,v).parts),t:'a',sym:x.sym})));
  CL=rnd(pool);
  $('#main').innerHTML=`<div class="card"><p class="consigna">¿Este óxido es <b>básico</b> o <b>ácido</b>?</p><div class="cls-show">${CL.f}</div>
  <div class="cls-btns"><button class="btn b1" data-a="cl" data-t="b">Básico</button><button class="btn b2" data-a="cl" data-t="a">Ácido</button></div>
  <div id="cl-out"></div><p class="consigna">Seguidas: <b id="cl-stk">${clStreak}</b></p></div>`;
}
function answerClas(t){
  if(CL.answered)return;CL.answered=true;
  const ok=t===CL.t;clStreak=ok?clStreak+1:0;
  const why=CL.t==='b'?`<b>${CL.sym}</b> es un metal → óxido <b>básico</b>. Con agua forma un hidróxido.`:`<b>${CL.sym}</b> es un no metal → óxido <b>ácido</b>.`;
  $('#cl-out').innerHTML=`<div class="msg ${ok?'ok':'bad'}"><p><b>${ok?'¡Bien!':'No.'}</b> ${why}</p></div><div class="btns" style="margin-top:8px"><button class="btn primary" data-a="clnext">Otro</button></div>`;
  $('#cl-stk').textContent=clStreak;
  $$('[data-a="cl"]').forEach(b=>b.disabled=true);
  if(ok&&clStreak&&clStreak%10===0)confetti();
}

/* ===== navegación ===== */
const TABS={nombres:{subs:[['nf','Nombre → fórmula'],['fn','Fórmula → nombre']]},hidroxidos:{subs:[['agua','Óxido + agua'],['metal','Desde el metal']]},hidruros:{subs:[['metal','Metálicos'],['nometal','No metálicos']]},sales:{subs:[['directa','Metal + no metal'],['neutral','Hidróxido + ácido']]},clas:{}};
const SUB=Object.assign({nombres:'nf',hidroxidos:'agua',hidruros:'metal',sales:'directa'},store.get('sub',{}));
let VIEW='hidroxidos';
function renderSub(){
  const t=TABS[VIEW],el=$('#sub');
  if(!t.subs){el.innerHTML='';return}
  el.innerHTML=`<div class="subnav" role="group" aria-label="Tipo de ejercicio">${t.subs.map(([k,l])=>`<button data-sub="${k}" aria-pressed="${SUB[VIEW]===k}">${l}</button>`).join('')}</div>`;
}
function renderView(){
  if(VIEW==='nombres')newNombre();
  else if(VIEW==='clas')newClas();
  else newExercise();
}
function show(v){VIEW=v;store.set('view',v);$$('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.v===v));renderSub();renderView()}
$$('.tab').forEach(t=>t.addEventListener('click',()=>show(t.dataset.v)));
$('#sub').addEventListener('click',ev=>{const b=ev.target.closest('[data-sub]');if(!b)return;SUB[VIEW]=b.dataset.sub;store.set('sub',SUB);renderSub();renderView()});
$('#main').addEventListener('click',ev=>{
  const tg=ev.target.closest('[data-nt]');
  if(tg){const k=tg.dataset.nt;NT[k]=NT[k]?0:1;store.set('ntypes',NT);NQ=null;newNombre();return}
  const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i;
  if(a==='check')checkRx(i);
  else if(a==='count'){const r=EX.rx[i],fs=r.species.map((s,j)=>s.unk?$(`#r${i}-p${j}`).value:s.f);out(i,'',fs.every(f=>parseFormula(f))?countTable(r,i,fs):'<p>Escribí primero el producto (con mayúsculas, por ejemplo NaCl) para poder contar.</p>')}
  else if(a==='hint')hint(i);else if(a==='show')showRx(i);
  else if(a==='ncheck')checkNames();else if(a==='nhint')nameHint();else if(a==='nshow')showNames();
  else if(a==='next')newExercise();
  else if(a==='cl')answerClas(b.dataset.t);else if(a==='clnext')newClas();
  else if(a==='nqcheck')nqCheck();else if(a==='nqhint')nqHint();else if(a==='nqnext')newNombre();
  else if(a==='nqshow'){if(!NQ.done){NQ.missed=true;nqFinish(false,'')}}
});
$('#main').addEventListener('input',ev=>{
  if(ev.target.id==='nq-in'&&NQ&&NQ.dir==='nf'){const pv=$('#nq-prev'),t=ev.target.value;if(t.trim()&&!/\s/.test(t.trim())){pv.innerHTML=`Se lee: <b>${esc(subNorm(t)).replace(/(\d+)/g,'<sub>$1</sub>')}</b>`;pv.hidden=false}else pv.hidden=true;return}
  const m=ev.target.id.match(/^r(\d)-p\d$/);if(!m)return;const pv=$(`#r${m[1]}-prev`),t=ev.target.value;
  if(t.trim()&&!/\s/.test(t.trim())){pv.innerHTML=`Se lee: <b>${esc(subNorm(t)).replace(/(\d+)/g,'<sub>$1</sub>')}</b>`;pv.hidden=false}else pv.hidden=true;
});
$('#main').addEventListener('keydown',ev=>{
  if(ev.key!=='Enter')return;const t=ev.target;
  if(t.id==='nq-in'){ev.preventDefault();NQ.done?newNombre():nqCheck();return}
  const m=t.id&&t.id.match(/^r(\d)-/);if(m){ev.preventDefault();checkRx(+m[1]);return}
  if(t.id&&t.id.startsWith('n-')){ev.preventDefault();checkNames()}
});

/* ===== confeti ===== */
function confetti(){
  if(reduceMotion())return;const cv=$('#confetti'),ctx=cv.getContext&&cv.getContext('2d');if(!ctx)return;
  const W=cv.width=innerWidth,H=cv.height=innerHeight,cs=getComputedStyle(document.documentElement);
  const cols=['--accent','--flame','--oxy','--hyd','--n-st'].map(v=>cs.getPropertyValue(v).trim()||'#0B7A6B');
  const P=Array.from({length:120},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*6+4,c:rnd(cols),a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let f=0;(function step(){ctx.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore()});
    if(++f<140)requestAnimationFrame(step);else ctx.clearRect(0,0,W,H)})();
}

/* ===== inicio ===== */
hud();
{
  const hv=(location.hash||'').slice(1),sv=store.get('view','');
  VIEW=TABS[hv]?hv:TABS[sv]?sv:'nombres';
  $$('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.v===VIEW));renderSub();
  if(VIEW==='hidroxidos'&&SUB.hidroxidos==='agua'&&!sv)startEx(exWater(EL.Al,3));else renderView();
}

<script>
/* Si hay una versión más nueva publicada, recarga la página salteando la caché */
(function(){
  var meta=document.querySelector('meta[name="app-version"]');
  if(!meta||!window.fetch)return;
  var actual=meta.content;
  fetch(location.pathname+'?nocache='+Date.now(),{cache:'no-store'})
    .then(function(r){return r.ok?r.text():''})
    .then(function(t){
      var m=t.match(/name="app-version" content="([^"]+)"/);
      if(!m||m[1]===actual)return;
      var u=new URL(location.href);
      if(u.searchParams.get('v')===m[1])return;
      u.searchParams.set('v',m[1]);
      location.replace(u.toString());
    })
    .catch(function(){});
})();
</script>
