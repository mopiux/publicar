<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comedor La Estación — Salón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Staatliches&family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────
   Tokens
   El color lo usan SOLO los estados de mesa. El resto es grafito.
   ───────────────────────────────────────────────────────────── */
:root{
  --fondo:#212930;
  --superficie:#2A343C;
  --superficie-alta:#334049;
  --borde:#3E4C57;
  --borde-suave:#333F48;
  --texto:#E9EFF3;
  --texto-medio:#A8B7C2;
  --texto-tenue:#788894;

  --libre:#8FA0AD;
  --ocupada:#4C93DC;
  --pidio:#E9A63C;
  --servida:#4CAE77;
  --cuenta:#F2703B;
  --limpiar:#9D7ED6;
  --alerta:#E9A63C;
  --peligro:#E05A4E;

  --r:10px;
  --tap:48px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--fondo);
  color:var(--texto);
  font-family:"Barlow Semi Condensed","Helvetica Neue",Arial,sans-serif;
  font-size:17px;
  line-height:1.35;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--ocupada);outline-offset:2px}
.num{font-family:"Barlow Condensed","Barlow Semi Condensed",sans-serif;font-variant-numeric:tabular-nums}

/* ── Estructura ───────────────────────────────────────────── */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.app[hidden]{display:none}

/* ── Barra superior ───────────────────────────────────────── */
.barra{
  display:flex;align-items:center;gap:18px;
  padding:0 18px;height:62px;flex:0 0 auto;
  background:var(--superficie);border-bottom:1px solid var(--borde-suave);
}
.local{display:flex;align-items:baseline;gap:10px;min-width:0}
.local b{font-weight:600;font-size:20px;white-space:nowrap}
.local span{color:var(--texto-tenue);font-size:15px;white-space:nowrap}
.barra .sep{flex:1}
.reloj{font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.usuario{
  display:flex;align-items:center;gap:9px;padding:7px 12px;
  border:1px solid var(--borde);border-radius:var(--r);font-size:15px;
}
.usuario i{
  width:26px;height:26px;border-radius:50%;background:var(--superficie-alta);
  display:grid;place-items:center;font-style:normal;font-weight:600;font-size:13px;
}
.red{
  display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:15px;
  border:1px solid var(--borde);border-radius:var(--r);color:var(--texto-medio);
}
.red .punto{width:9px;height:9px;border-radius:50%;background:var(--servida)}
.red.off{border-color:var(--alerta);color:var(--alerta)}
.red.off .punto{background:var(--alerta)}

/* ── Avisos ───────────────────────────────────────────────── */
.avisos{flex:0 0 auto}
.aviso{
  display:flex;align-items:center;gap:14px;padding:12px 18px;
  border-bottom:1px solid var(--borde-suave);font-size:17px;
}
.aviso.qr{background:rgba(233,166,60,.14);color:#F4C57E;border-bottom-color:rgba(233,166,60,.3)}
.aviso.sinred{background:rgba(233,166,60,.1);color:#F4C57E}
.aviso b{font-weight:600}
.aviso .sep{flex:1}
.aviso button{
  padding:9px 15px;border-radius:8px;font-weight:600;font-size:16px;
  background:var(--alerta);color:#2A2013;
}
.pulso{width:11px;height:11px;border-radius:50%;background:var(--alerta);flex:0 0 auto}
@media (prefers-reduced-motion:no-preference){
  .pulso{animation:late 1.6s ease-in-out infinite}
}
@keyframes late{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}

/* ── Filtros ──────────────────────────────────────────────── */
.filtros{
  display:flex;align-items:center;gap:8px;padding:11px 18px;flex:0 0 auto;
  border-bottom:1px solid var(--borde-suave);overflow-x:auto;scrollbar-width:none;
}
.filtros::-webkit-scrollbar{display:none}
.chip{
  display:flex;align-items:center;gap:8px;white-space:nowrap;
  padding:9px 14px;border:1px solid var(--borde);border-radius:999px;
  color:var(--texto-medio);font-size:16px;min-height:42px;
}
.chip .marca{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.chip .cant{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:18px;color:var(--texto)}
.chip[aria-pressed="true"]{background:var(--superficie-alta);border-color:var(--texto-tenue);color:var(--texto)}
.filtros .divisor{width:1px;height:26px;background:var(--borde);flex:0 0 auto;margin:0 4px}

/* ── Grilla ───────────────────────────────────────────────── */
.piso{flex:1;overflow-y:auto;padding:18px 18px 120px}
.sector{margin-bottom:26px}
.sector h2{
  font-family:"Barlow Semi Condensed",sans-serif;
  font-size:16px;font-weight:600;color:var(--texto-tenue);
  margin-bottom:11px;display:flex;align-items:center;gap:10px;
}
.sector h2::after{content:"";flex:1;height:1px;background:var(--borde-suave)}
.grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:13px}

.mesa{
  position:relative;text-align:left;
  border:2px solid var(--borde);border-radius:var(--r);
  background:var(--superficie);
  padding:13px 14px 12px;min-height:146px;
  display:flex;flex-direction:column;
  transition:transform .08s ease;
}
.mesa:active{transform:scale(.98)}
.mesa .cab{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.mesa .n{
  font-family:"Barlow Condensed",sans-serif;font-weight:700;
  font-size:56px;line-height:.82;letter-spacing:-.01em;
}
.mesa .cap{
  display:flex;flex-direction:column;align-items:flex-end;gap:2px;
  font-size:15px;color:var(--texto-tenue);padding-top:5px;
  text-align:right;line-height:1.15;max-width:52%;
}
.mesa .cap span{white-space:nowrap}
.mesa .est{
  margin-top:11px;font-size:16px;font-weight:600;line-height:1;
}
.mesa .pie{margin-top:auto;padding-top:10px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.mesa .tiempo{font-size:15px;color:var(--texto-medio);font-variant-numeric:tabular-nums}
.mesa .plata{font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.mesa .marca-qr{
  position:absolute;top:-9px;right:-6px;
  background:var(--alerta);color:#2A2013;font-weight:700;font-size:14px;
  padding:3px 9px;border-radius:999px;
}
.mesa .unida{font-size:14px;color:var(--texto-medio);opacity:.85}

.mesa.e-libre{border-style:dashed;border-color:var(--borde);background:transparent}
.mesa.e-libre .n{color:var(--texto-tenue)}
.mesa.e-libre .est{color:var(--texto-tenue);font-weight:500}
.mesa.e-ocupada{border-color:var(--ocupada);background:rgba(76,147,220,.13)}
.mesa.e-ocupada .est{color:var(--ocupada)}
.mesa.e-pidio{border-color:var(--pidio);background:rgba(233,166,60,.13)}
.mesa.e-pidio .est{color:var(--pidio)}
.mesa.e-servida{border-color:var(--servida);background:rgba(76,174,119,.13)}
.mesa.e-servida .est{color:var(--servida)}
.mesa.e-cuenta{border-color:var(--cuenta);background:rgba(242,112,59,.16)}
.mesa.e-cuenta .est{color:var(--cuenta)}
.mesa.e-limpiar{border-color:var(--limpiar);background:rgba(157,126,214,.13)}
.mesa.e-limpiar .est{color:var(--limpiar)}

.mesa.elegida{border-color:var(--texto);background:var(--superficie-alta)}
.mesa.elegida::after{
  content:"✓";position:absolute;top:9px;right:11px;
  width:28px;height:28px;border-radius:50%;background:var(--texto);color:var(--fondo);
  display:grid;place-items:center;font-size:17px;font-weight:700;
}
.mesa.apagada{opacity:.24;pointer-events:none}

.vacio{padding:60px 20px;text-align:center;color:var(--texto-tenue);font-size:18px}

/* ── Barra de acciones ────────────────────────────────────── */
.acciones{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;align-items:center;gap:11px;
  padding:13px 18px;padding-bottom:calc(13px + env(safe-area-inset-bottom));
  background:var(--superficie);border-top:1px solid var(--borde);
}
.acciones .texto{color:var(--texto-medio);font-size:16px;margin-right:auto}
.btn{
  min-height:var(--tap);padding:0 20px;border-radius:9px;
  border:1px solid var(--borde);font-size:17px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
}
.btn:hover{background:var(--superficie-alta)}
.btn.lleno{background:var(--texto);color:var(--fondo);border-color:var(--texto)}
.btn.lleno:hover{background:#fff}
.btn.aviso-btn{background:var(--alerta);color:#2A2013;border-color:var(--alerta)}
.btn.mal{color:var(--peligro);border-color:rgba(224,90,78,.5)}
.btn.mal:hover{background:rgba(224,90,78,.14)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.ancho{width:100%}

/* ── Panel de detalle ─────────────────────────────────────── */
.telon{
  position:fixed;inset:0;background:rgba(14,18,21,.6);z-index:30;
  opacity:0;pointer-events:none;transition:opacity .16s ease;
}
.telon.abierto{opacity:1;pointer-events:auto}
.panel{
  position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);z-index:31;
  background:var(--superficie);border-left:1px solid var(--borde);
  display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .2s cubic-bezier(.32,.72,0,1);
}
.panel.abierto{transform:none}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}

.panel-cab{padding:18px;border-bottom:1px solid var(--borde-suave);flex:0 0 auto}
.panel-cab .fila{display:flex;align-items:flex-start;gap:14px}
.panel-cab .n{font-family:"Barlow Condensed",sans-serif;font-size:52px;font-weight:700;line-height:.85}
.panel-cab .datos{padding-top:3px;flex:1}
.panel-cab .estado{font-size:18px;font-weight:600;margin-bottom:3px}
.panel-cab .sub{font-size:16px;color:var(--texto-medio)}
.cerrar{width:44px;height:44px;border-radius:9px;font-size:24px;color:var(--texto-medio);flex:0 0 auto}
.cerrar:hover{background:var(--superficie-alta)}

.panel-cuerpo{flex:1;overflow-y:auto;padding:18px}
.panel-pie{padding:14px 18px;padding-bottom:calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--borde-suave);flex:0 0 auto}
.panel-pie .total{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:13px}
.panel-pie .total span{font-size:17px;color:var(--texto-medio)}
.panel-pie .total b{font-family:"Barlow Condensed",sans-serif;font-size:36px;font-weight:700;font-variant-numeric:tabular-nums}
.botonera{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.botonera .full{grid-column:1/-1}

.ronda{margin-bottom:18px}
.ronda-cab{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-size:15px;color:var(--texto-tenue)}
.ronda-cab .destino{
  padding:3px 9px;border:1px solid var(--borde);border-radius:6px;
  color:var(--texto-medio);font-weight:500;
}
.ronda-cab .sep{flex:1;height:1px;background:var(--borde-suave)}
.item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--borde-suave)}
.item .cant{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:600;min-width:30px;color:var(--texto-medio)}
.item .cuerpo{flex:1;min-width:0}
.item .nom{font-size:17px;font-weight:500}
.item .acl{font-size:15px;color:var(--pidio);margin-top:2px}
.item .lado{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.item .precio{font-family:"Barlow Condensed",sans-serif;font-size:19px;font-variant-numeric:tabular-nums}
.item.anulado .nom,.item.anulado .cant,.item.anulado .precio{text-decoration:line-through;color:var(--texto-tenue)}
.item .motivo{font-size:14px;color:var(--texto-tenue);margin-top:3px}
.marca-est{font-size:14px;padding:2px 8px;border-radius:5px;border:1px solid;white-space:nowrap}
.m-pendiente{color:var(--texto-medio);border-color:var(--borde)}
.m-en_cocina{color:var(--pidio);border-color:rgba(233,166,60,.45)}
.m-listo{color:var(--servida);border-color:rgba(76,174,119,.45)}
.m-entregado{color:var(--texto-tenue);border-color:var(--borde-suave)}
.m-anulado{color:var(--peligro);border-color:rgba(224,90,78,.4)}
.mini{background:none;border:none;color:var(--texto-tenue);font-size:14px;padding:4px 0;text-decoration:underline}
.mini:hover{color:var(--peligro)}

.tarjeta-qr{
  border:1px solid rgba(233,166,60,.45);background:rgba(233,166,60,.1);
  border-radius:var(--r);padding:14px;margin-bottom:18px;
}
.tarjeta-qr h3{font-size:17px;font-weight:600;color:#F4C57E;margin-bottom:4px}
.tarjeta-qr p{font-size:15px;color:var(--texto-medio);margin-bottom:11px}
.tarjeta-qr .item{border-bottom-color:rgba(233,166,60,.2)}
.tarjeta-qr .botonera{margin-top:12px}

.nada{text-align:center;padding:40px 16px;color:var(--texto-tenue)}
.nada p{font-size:17px;margin-bottom:6px}
.nada small{font-size:15px;color:var(--texto-tenue);opacity:.8}

/* ── Modal ────────────────────────────────────────────────── */
.modal{
  position:fixed;inset:0;z-index:40;display:none;
  place-items:center;padding:20px;background:rgba(14,18,21,.72);
}
.modal.abierto{display:grid}
.caja{
  width:min(430px,100%);background:var(--superficie);
  border:1px solid var(--borde);border-radius:14px;padding:20px;
}
.caja h3{font-size:21px;font-weight:600;margin-bottom:7px}
.caja p{font-size:16px;color:var(--texto-medio);margin-bottom:16px}
.caja label{display:block;font-size:15px;color:var(--texto-medio);margin-bottom:7px}
.opciones{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.opciones button{
  padding:11px 14px;border:1px solid var(--borde);border-radius:8px;font-size:16px;
  color:var(--texto-medio);min-height:44px;
}
.opciones button[aria-pressed="true"]{background:var(--texto);color:var(--fondo);border-color:var(--texto);font-weight:600}
input[type=text],input[type=number]{
  width:100%;padding:13px 14px;font:inherit;font-size:17px;
  background:var(--fondo);color:var(--texto);
  border:1px solid var(--borde);border-radius:8px;margin-bottom:16px;
}
input::placeholder{color:var(--texto-tenue)}
.pin{letter-spacing:.5em;font-family:"Barlow Condensed",sans-serif;font-size:24px}

/* ── Aviso flotante ───────────────────────────────────────── */
.tostada{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);z-index:50;
  background:var(--superficie-alta);border:1px solid var(--borde);
  border-radius:10px;padding:13px 20px;font-size:17px;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  max-width:calc(100% - 32px);text-align:center;
}
.tostada.visible{opacity:1;transform:translate(-50%,0)}

/* ── Armado de pedido ─────────────────────────────────────── */
.pedido{display:flex;flex-direction:column;height:100vh;height:100dvh}
.pedido[hidden]{display:none}
.volver{
  display:flex;align-items:center;gap:8px;height:44px;padding:0 15px;
  border:1px solid var(--borde);border-radius:9px;font-size:17px;font-weight:600;flex:0 0 auto;
}
.volver:hover{background:var(--superficie-alta)}
.buscar{position:relative;flex:0 1 320px}
.barra input.busq{
  width:100%;margin:0;height:44px;padding:0 14px;font-size:17px;
  background:var(--fondo);border:1px solid var(--borde);border-radius:9px;color:var(--texto);
}
.pedido-cuerpo{flex:1;display:flex;min-height:0}
.carta-col{flex:1;display:flex;flex-direction:column;min-width:0}
.rubros{
  display:flex;gap:8px;padding:11px 18px;overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid var(--borde-suave);flex:0 0 auto;
}
.rubros::-webkit-scrollbar{display:none}
.carta{flex:1;overflow-y:auto;padding:16px 18px 24px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(214px,1fr));gap:11px}
.rubro-tit{
  font-size:16px;font-weight:600;color:var(--texto-tenue);
  margin:20px 0 11px;display:flex;align-items:center;gap:10px;
}
.rubro-tit:first-child{margin-top:0}
.rubro-tit::after{content:"";flex:1;height:1px;background:var(--borde-suave)}
.plato{
  text-align:left;border:1px solid var(--borde);border-radius:var(--r);
  background:var(--superficie);padding:12px 13px;min-height:96px;
  display:flex;flex-direction:column;gap:7px;transition:transform .07s ease;
}
.plato:hover{border-color:var(--texto-tenue)}
.plato:active{transform:scale(.97)}
.plato .nom{font-size:17px;line-height:1.2;font-weight:500;flex:1}
.plato .fila{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.plato .precio{font-family:"Barlow Condensed",sans-serif;font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.plato .dest{font-size:13px;color:var(--texto-tenue)}
.plato .llevan{
  align-self:flex-start;font-family:"Barlow Condensed",sans-serif;font-size:15px;font-weight:600;
  background:var(--texto);color:var(--fondo);border-radius:999px;padding:1px 9px;
}
.plato.agotado{opacity:.4;pointer-events:none;border-style:dashed}
.plato.agotado .precio{text-decoration:line-through}
.plato .sinstock{font-size:14px;color:var(--peligro)}

.ticket{
  width:370px;flex:0 0 auto;display:flex;flex-direction:column;
  border-left:1px solid var(--borde);background:var(--superficie);min-height:0;
}
.ticket-cab{padding:15px 16px 12px;border-bottom:1px solid var(--borde-suave);font-size:16px;color:var(--texto-medio)}
.ticket-lista{flex:1;overflow-y:auto;padding:6px 16px 16px}
.ticket-pie{padding:14px 16px;padding-bottom:calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--borde-suave)}
.linea{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--borde-suave)}
.linea .txt{flex:1;min-width:0}
.linea .txt b{display:block;font-size:16px;font-weight:500;line-height:1.2}
.linea .acl{font-size:14px;color:var(--pidio);margin-top:3px}
.linea .acl button{color:inherit;text-decoration:underline;font-size:14px}
.linea .ponerAcl{font-size:14px;color:var(--texto-tenue);text-decoration:underline;margin-top:3px}
.linea .der{text-align:right;flex:0 0 auto}
.linea .precio{font-family:"Barlow Condensed",sans-serif;font-size:18px;font-variant-numeric:tabular-nums;display:block}
.contador{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.contador button{
  width:34px;height:34px;border:1px solid var(--borde);border-radius:7px;
  font-size:20px;line-height:1;color:var(--texto-medio);
}
.contador button:hover{background:var(--superficie-alta);color:var(--texto)}
.contador .v{
  min-width:32px;text-align:center;font-family:"Barlow Condensed",sans-serif;
  font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;
}
.ya{margin-top:18px}
.ya-cab{font-size:15px;color:var(--texto-tenue);padding-bottom:7px;border-bottom:1px solid var(--borde-suave)}
.ya .linea{opacity:.62}
.ticket .nada{padding:34px 10px}
.reparto{font-size:15px;color:var(--texto-medio);margin-bottom:11px;display:flex;flex-wrap:wrap;gap:7px}
.reparto span{border:1px solid var(--borde);border-radius:6px;padding:2px 9px}
.ticket-pie .total{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.ticket-pie .total span{font-size:17px;color:var(--texto-medio)}
.ticket-pie .total b{font-family:"Barlow Condensed",sans-serif;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.abrirTicket{display:none}

@media (max-width:900px){
  .ticket{
    position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;z-index:25;
    max-height:78vh;border-left:none;border-top:1px solid var(--borde);
    border-radius:16px 16px 0 0;transform:translateY(100%);
    transition:transform .2s cubic-bezier(.32,.72,0,1);
  }
  .ticket.abierto{transform:none}
  .abrirTicket{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:24;
    align-items:center;gap:12px;padding:12px 15px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
    background:var(--superficie);border-top:1px solid var(--borde);font-size:17px;
  }
  .abrirTicket .plata{font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:700;margin-left:auto}
  .carta{padding-bottom:96px}
  .rejilla{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
  .plato{min-height:88px;padding:10px}
  .plato .nom{font-size:16px}
  .pedido .barra{flex-wrap:wrap;height:auto;padding:9px 13px;gap:9px}
  .buscar{flex:1 1 100%;order:3}
}
@media (max-width:720px){
  body{font-size:16px}
  .barra{height:56px;padding:0 13px;gap:11px}
  .local span,.usuario span{display:none}
  .reloj{font-size:22px}
  .piso{padding:13px 13px 110px}
  .grilla{grid-template-columns:repeat(2,1fr);gap:10px}
  .mesa{min-height:132px;padding:11px}
  .mesa .n{font-size:46px}
  .panel{width:100%;top:auto;height:88vh;border-left:none;border-top:1px solid var(--borde);border-radius:16px 16px 0 0;transform:translateY(100%)}
  .panel.abierto{transform:none}
  .acciones{gap:8px;padding:11px 13px}
  .acciones .texto{font-size:15px}
  .btn{padding:0 15px;font-size:16px}
}

/* ── Cocina ───────────────────────────────────────────────── */
.cocina{display:flex;flex-direction:column;height:100vh;height:100dvh}
.cocina[hidden]{display:none}
.destinos{
  display:flex;gap:9px;padding:12px 18px;flex:0 0 auto;overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid var(--borde-suave);
}
.destinos::-webkit-scrollbar{display:none}
.destinos .chip{font-size:18px;padding:11px 18px;min-height:50px}
.tablero{flex:1;overflow-y:auto;padding:16px 18px 28px}
.tablero-grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;align-items:start}
.bloque-tit{
  font-size:17px;font-weight:600;color:var(--texto-tenue);
  margin:24px 0 12px;display:flex;align-items:center;gap:11px;
}
.bloque-tit:first-child{margin-top:0}
.bloque-tit::after{content:"";flex:1;height:1px;background:var(--borde-suave)}

.comanda{
  border:2px solid var(--borde);border-radius:12px;background:var(--superficie);
  display:flex;flex-direction:column;overflow:hidden;
}
.comanda-cab{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid var(--borde-suave)}
.comanda-cab .nro{font-family:"Barlow Condensed",sans-serif;font-size:38px;font-weight:700;line-height:1;margin-bottom:3px}
.comanda-cab .meta{font-size:15px;color:var(--texto-tenue);line-height:1.25}
.comanda-cab .espera{
  margin-left:auto;text-align:right;font-family:"Barlow Condensed",sans-serif;
  font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;
}
.comanda-cab .espera small{
  display:block;font-family:"Barlow Semi Condensed",sans-serif;
  font-size:14px;font-weight:400;color:var(--texto-tenue);
}
.plato-fila{
  display:flex;gap:13px;width:100%;text-align:left;align-items:flex-start;
  padding:12px 15px;border-bottom:1px solid var(--borde-suave);min-height:56px;
}
.plato-fila:last-child{border-bottom:none}
.plato-fila:hover{background:var(--superficie-alta)}
.plato-fila .c{font-family:"Barlow Condensed",sans-serif;font-size:27px;font-weight:700;min-width:34px;line-height:1.05}
.plato-fila .t{flex:1;min-width:0}
.plato-fila .t b{font-size:19px;font-weight:500;line-height:1.2;display:block}
.plato-fila .t .acl{font-size:17px;color:var(--pidio);font-weight:600;margin-top:3px}
.plato-fila .tilde{
  width:32px;height:32px;border-radius:8px;border:2px solid var(--borde);
  flex:0 0 auto;display:grid;place-items:center;font-size:19px;color:transparent;
}
.plato-fila.hecho{opacity:.45}
.plato-fila.hecho .t b{text-decoration:line-through}
.plato-fila.hecho .tilde{background:var(--servida);border-color:var(--servida);color:#12231A}
.comanda-pie{padding:12px 15px;border-top:1px solid var(--borde-suave);margin-top:auto}
.comanda-pie .btn{width:100%;min-height:54px;font-size:19px}

.c-media{border-color:var(--pidio)}
.c-media .espera{color:var(--pidio)}
.c-tarde{border-color:var(--peligro);background:rgba(224,90,78,.09)}
.c-tarde .espera{color:var(--peligro)}
.c-lista{border-color:var(--servida);background:rgba(76,174,119,.09)}
.c-lista .espera{color:var(--servida)}

@media (max-width:720px){
  .tablero-grilla{grid-template-columns:1fr}
  .cocina .barra{height:auto;padding:10px 13px;flex-wrap:wrap;gap:9px}
}
/* ── Cobro y cierre ───────────────────────────────────────── */
.cobro{display:flex;flex-direction:column;height:100vh;height:100dvh}
.cobro[hidden]{display:none}
.cb-cuerpo{flex:1;display:flex;min-height:0}
.cb-izq{flex:1;overflow-y:auto;padding:18px;min-width:0}
.cb-der{
  width:400px;flex:0 0 auto;display:flex;flex-direction:column;min-height:0;
  border-left:1px solid var(--borde);background:var(--superficie);
}
.cb-tit{font-size:16px;font-weight:600;color:var(--texto-tenue);margin:0 0 12px;display:flex;align-items:center;gap:10px}
.cb-tit::after{content:"";flex:1;height:1px;background:var(--borde-suave)}
.cb-tit.arriba{margin-top:24px}

.cb-fila{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--borde-suave)}
.cb-fila .c{font-family:"Barlow Condensed",sans-serif;font-size:21px;font-weight:600;min-width:30px;color:var(--texto-medio)}
.cb-fila .t{flex:1;min-width:0}
.cb-fila .t b{font-size:17px;font-weight:500;display:block;line-height:1.25}
.cb-fila .t .acl{font-size:14px;color:var(--texto-tenue);margin-top:2px}
.cb-fila .p{font-family:"Barlow Condensed",sans-serif;font-size:19px;font-variant-numeric:tabular-nums;text-align:right}
.cb-fila.anulada{opacity:.4}
.cb-fila.anulada .t b,.cb-fila.anulada .p{text-decoration:line-through}
.cb-repartir{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cb-repartir button{
  border:1px solid var(--borde);border-radius:7px;padding:5px 11px;
  font-size:15px;color:var(--texto-medio);min-height:36px;
}
.cb-repartir button:hover{background:var(--superficie-alta);color:var(--texto)}
.cb-repartir button.tiene{background:var(--texto);color:var(--fondo);border-color:var(--texto);font-weight:600}
.cb-sobra{
  border:1px dashed var(--peligro);border-radius:9px;padding:11px 14px;
  color:var(--peligro);font-size:16px;margin-top:14px;
}

.cb-modos{display:flex;gap:8px;padding:15px 16px 12px;flex:0 0 auto}
.cb-modos button{
  flex:1;min-height:52px;border:1px solid var(--borde);border-radius:9px;
  font-size:16px;color:var(--texto-medio);line-height:1.15;padding:0 6px;
}
.cb-modos button[aria-pressed="true"]{background:var(--texto);color:var(--fondo);border-color:var(--texto);font-weight:600}
.cb-cuantos{display:flex;align-items:center;gap:12px;padding:0 16px 14px;font-size:16px;color:var(--texto-medio)}
.cb-partes{flex:1;overflow-y:auto;padding:0 16px 16px}
.cb-parte{
  border:1px solid var(--borde);border-radius:10px;padding:12px 14px;margin-bottom:10px;
  display:flex;align-items:center;gap:12px;
}
.cb-parte .nom{font-size:17px;font-weight:500;flex:1;min-width:0}
.cb-parte .nom small{display:block;font-size:14px;color:var(--texto-tenue);font-weight:400;margin-top:2px}
.cb-parte .mon{font-family:"Barlow Condensed",sans-serif;font-size:23px;font-weight:600;font-variant-numeric:tabular-nums}
.cb-parte .btn{min-height:42px;padding:0 15px;font-size:16px}
.cb-parte.activa{border-color:var(--texto);background:var(--superficie-alta)}
.cb-parte.pagada{border-color:var(--servida);background:rgba(76,174,119,.1)}
.cb-parte.pagada .mon{color:var(--servida)}

.cb-pie{padding:14px 16px;padding-bottom:calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--borde-suave);flex:0 0 auto}
.cb-cuentas{font-size:16px;margin-bottom:12px}
.cb-cuentas div{display:flex;justify-content:space-between;padding:3px 0;color:var(--texto-medio)}
.cb-cuentas div.fuerte{color:var(--texto);font-size:18px;font-weight:600;padding-top:9px;margin-top:6px;border-top:1px solid var(--borde-suave)}
.cb-cuentas div.falta{color:var(--peligro);font-weight:600}
.cb-cuentas div.listo{color:var(--servida);font-weight:600}
.cb-cuentas .num{font-family:"Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;font-size:1.15em}
.cb-acciones{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cb-acciones .full{grid-column:1/-1}

.cb-vuelto{
  background:var(--fondo);border:1px solid var(--borde);border-radius:9px;
  padding:13px 15px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:baseline;
}
.cb-vuelto span{font-size:16px;color:var(--texto-medio)}
.cb-vuelto b{font-family:"Barlow Condensed",sans-serif;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.cb-vuelto b.corto{color:var(--peligro)}

@media (max-width:980px){
  .cb-cuerpo{flex-direction:column}
  .cb-der{width:100%;border-left:none;border-top:1px solid var(--borde);max-height:60vh}
  .cb-izq{max-height:40vh}
}

/* ── Cuenta impresa, 80 mm ────────────────────────────────── */
#impresion{display:none}
@media print{
  body{background:#fff;color:#000;overflow:visible}
  .app,.pedido,.cocina,.cobro,.panel,.telon,.modal,.tostada{display:none !important}
  #impresion{
    display:block;width:72mm;margin:0 auto;padding:4mm 0;
    font-family:"Barlow Semi Condensed",sans-serif;font-size:11pt;line-height:1.35;color:#000;
  }
  #impresion h1{font-size:15pt;text-align:center;margin-bottom:1mm}
  #impresion .sub{text-align:center;font-size:9.5pt;margin-bottom:3mm}
  #impresion hr{border:none;border-top:1px dashed #000;margin:3mm 0}
  #impresion .l{display:flex;justify-content:space-between;gap:4mm;padding:.6mm 0}
  #impresion .l .n{flex:1}
  #impresion .tot{font-size:14pt;font-weight:700}
  #impresion .legal{text-align:center;font-size:9pt;margin-top:4mm;line-height:1.3}
}
/* ── Carta pública del cliente ─────────────────────────────
   Estilo propio, tipo pizarra de madera. No comparte look con
   la caja a propósito: esta es la cara del local al cliente. */
.cliente{
  --madera:#9A6A38; --veta:#7E5227; --tinta:#140D07;
  --naranja:#F2883B; --crema:#FCF4E8; --panel:rgba(20,13,7,.52);
  display:flex;flex-direction:column;height:100vh;height:100dvh;
  max-width:560px;margin:0 auto;color:var(--crema);
  background:
    repeating-linear-gradient(91deg, rgba(0,0,0,.16) 0 2px, transparent 2px 74px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.032) 0 1px, transparent 1px 19px),
    repeating-linear-gradient(89deg, rgba(0,0,0,.05) 0 3px, transparent 3px 11px),
    linear-gradient(168deg, #A87540, var(--madera) 40%, var(--veta));
}
.cliente[hidden]{display:none}

.cl-cab{padding:20px 18px 14px;flex:0 0 auto;display:flex;align-items:flex-start;gap:12px}
.cl-cab h1{
  font-family:"Staatliches","Barlow Condensed",sans-serif;font-weight:400;
  font-size:33px;line-height:.98;letter-spacing:.01em;color:var(--crema);
  text-shadow:0 2px 0 rgba(0,0,0,.35);
}
.cl-cab .mesa-et{
  font-size:15px;color:rgba(252,244,232,.72);margin-top:5px;
  letter-spacing:.02em;
}
.cl-cab .btn{
  min-height:44px;padding:0 16px;font-size:16px;margin-left:auto;flex:0 0 auto;
  background:var(--tinta);color:var(--crema);border:none;border-radius:999px;font-weight:600;
}
.cl-cab .btn:hover{background:#000}

.cl-rubros{
  display:flex;gap:8px;padding:6px 18px 14px;overflow-x:auto;
  scrollbar-width:none;border-bottom:none;flex:0 0 auto;
}
.cl-rubros::-webkit-scrollbar{display:none}
.cliente .chip{
  border:1px solid rgba(252,244,232,.32);border-radius:999px;
  color:rgba(252,244,232,.85);background:rgba(20,13,7,.22);
  font-size:15px;padding:8px 15px;min-height:40px;white-space:nowrap;
}
.cliente .chip[aria-pressed="true"]{
  background:var(--tinta);border-color:var(--tinta);color:var(--naranja);font-weight:600;
}

.cl-cuerpo{flex:1;overflow-y:auto;padding:2px 18px 118px}

.cl-rubro{
  display:inline-block;background:var(--tinta);border-radius:999px;
  padding:9px 26px;margin:22px 0 0;
  font-family:"Staatliches","Barlow Condensed",sans-serif;font-weight:400;
  font-size:25px;letter-spacing:.05em;color:var(--naranja);text-transform:uppercase;
}
.cl-panel{
  background:var(--panel);border-radius:16px;padding:8px 16px;margin-top:-16px;
  padding-top:26px;
}
.cl-plato{
  display:flex;gap:14px;width:100%;text-align:left;align-items:center;
  padding:11px 0;border-bottom:1px solid rgba(252,244,232,.12);color:inherit;
}
.cl-plato:last-child{border-bottom:none}
.foto{
  width:58px;height:58px;flex:0 0 auto;border-radius:50%;overflow:hidden;
  position:relative;border:3px solid var(--tinta);background:var(--veta);
}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto .plato-ph{position:absolute;inset:0}
.cl-plato .info{flex:1;min-width:0;display:flex;align-items:baseline;gap:9px}
.cl-plato .info b{font-size:16.5px;font-weight:400;line-height:1.25}
.cl-plato .info .guia{
  flex:1;min-width:14px;border-bottom:1px dotted rgba(252,244,232,.3);
  transform:translateY(-4px);
}
.cl-plato .info .pr{
  font-size:17px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;
}
.cl-plato .r{display:none}
.cl-plato .mas{
  align-self:center;width:40px;height:40px;flex:0 0 auto;border-radius:50%;
  border:2px solid rgba(252,244,232,.4);font-size:22px;color:var(--crema);
  display:grid;place-items:center;line-height:1;
}
.cl-plato .mas.tiene{
  background:var(--naranja);color:var(--tinta);border-color:var(--naranja);
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;
}
.cl-plato.agotado{opacity:.45}
.cl-plato.agotado .pr,.cl-plato.agotado b{text-decoration:line-through}
.cl-plato .nostock{font-size:14px;color:var(--naranja);white-space:nowrap}

.cl-pie{
  text-align:center;margin-top:30px;padding-top:6px;
  font-family:"Staatliches","Barlow Condensed",sans-serif;
  font-size:19px;letter-spacing:.04em;color:var(--crema);line-height:1.4;
}
.cl-pie span{
  display:inline-block;margin-top:11px;background:var(--tinta);color:var(--naranja);
  border-radius:999px;padding:8px 24px;font-size:18px;
}

.cl-barra{
  position:fixed;left:0;right:0;bottom:0;z-index:24;max-width:560px;margin:0 auto;
  display:flex;align-items:center;gap:12px;padding:13px 18px;
  padding-bottom:calc(13px + env(safe-area-inset-bottom));
  background:var(--tinta);border-top:none;font-size:16px;color:var(--crema);
}
.cl-barra .plata{
  font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:700;
  margin-left:auto;font-variant-numeric:tabular-nums;
}
.cliente .cl-barra .btn{min-height:44px;padding:0 17px;border-radius:999px;border-color:rgba(252,244,232,.3)}
.cliente .cl-barra .btn.lleno{background:var(--naranja);color:var(--tinta);border-color:var(--naranja)}

/* Vista "Mi mesa", con la misma piel */
.cliente .cb-tit{color:var(--naranja);font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.cliente .cb-tit::after{background:rgba(252,244,232,.22)}
.cliente .cb-fila{border-bottom-color:rgba(252,244,232,.14)}
.cliente .cb-fila .c,.cliente .cb-fila .t b,.cliente .cb-fila .p{color:var(--crema)}
.cliente .cb-cuentas div{color:rgba(252,244,232,.8)}
.cliente .cb-cuentas div.fuerte{color:var(--crema);border-top-color:rgba(252,244,232,.25)}
.cliente .nada p,.cliente .nada small{color:rgba(252,244,232,.72)}
.cliente .botonera .btn{
  background:var(--tinta);border-color:var(--tinta);color:var(--crema);
  border-radius:999px;min-height:50px;
}
.cliente .botonera .btn[disabled]{opacity:.45}
.cl-aviso{
  border:none;background:var(--tinta);border-radius:12px;
  padding:14px 16px;margin-bottom:16px;font-size:16px;color:var(--naranja);
}
.cl-ok{
  border:none;background:var(--tinta);border-radius:12px;
  padding:14px 16px;margin-bottom:16px;font-size:16px;color:#8FD8A8;
}


/* ── Hoja de códigos QR ───────────────────────────────────── */
.qrs{display:flex;flex-direction:column;height:100vh;height:100dvh}
.qrs[hidden]{display:none}
.qr-cuerpo{flex:1;overflow-y:auto;padding:18px}
.qr-grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.qr-carta{
  border:1px solid var(--borde);border-radius:12px;background:#fff;color:#111;
  padding:14px;text-align:center;
}
.qr-carta .lugar{font-size:15px;color:#444;font-weight:600}
.qr-carta .n{font-family:"Barlow Condensed",sans-serif;font-size:40px;font-weight:700;line-height:1;margin:2px 0 8px}
.qr-carta svg{width:100%;height:auto;display:block}
.qr-carta .pie{font-size:13px;color:#444;margin-top:8px;line-height:1.3}
@media print{
  .qrs{display:block !important}
  .qrs .barra,.qr-aclara{display:none !important}
  .qr-cuerpo{overflow:visible;padding:0}
  .qr-grilla{grid-template-columns:repeat(3,1fr);gap:8mm}
  .qr-carta{border:1px solid #999;break-inside:avoid;page-break-inside:avoid}
}
.qr-aclara{font-size:16px;color:var(--texto-medio);margin-bottom:16px;max-width:66ch;line-height:1.45}
/* ── Panel del dueño ──────────────────────────────────────── */
.dueno{display:flex;flex-direction:column;height:100vh;height:100dvh}
.dueno[hidden]{display:none}
.dn-solapas{display:flex;gap:9px;padding:12px 18px;flex:0 0 auto;border-bottom:1px solid var(--borde-suave)}
.dn-solapas .chip{font-size:17px;padding:10px 18px;min-height:46px}
.dn-barra{
  display:flex;gap:9px;align-items:center;padding:13px 18px;flex-wrap:wrap;
  border-bottom:1px solid var(--borde-suave);flex:0 0 auto;
}
.dn-barra input.busq{
  margin:0;height:44px;padding:0 14px;font-size:16px;width:210px;
  background:var(--fondo);border:1px solid var(--borde);border-radius:9px;color:var(--texto);
}
.dn-barra .sep{flex:1}
.dn-cuerpo{flex:1;overflow-y:auto;padding:16px 18px 28px}
.dn-nota{font-size:15px;color:var(--texto-tenue);margin-bottom:16px;max-width:76ch;line-height:1.5}

.dn-fila{
  display:grid;grid-template-columns:1fr 150px 120px 130px auto auto;
  gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid var(--borde-suave);
}
.dn-fila.cab{
  border-bottom:1px solid var(--borde);padding-bottom:8px;
  font-size:14px;color:var(--texto-tenue);text-transform:uppercase;letter-spacing:.05em;
}
.dn-fila.mesas{grid-template-columns:110px 1fr 1fr auto}
.dn-fila input,.dn-fila select{
  margin:0;height:44px;padding:0 11px;font-size:16px;width:100%;
  background:var(--fondo);color:var(--texto);border:1px solid var(--borde);border-radius:8px;
}

<script>
/* Codificador QR mínimo: modo byte, corrección M, versiones 1 a 10. */
const QR = (() => {
  const EC = {
    1:[16,10,1,16,0,0],   2:[28,16,1,28,0,0],   3:[44,26,1,44,0,0],
    4:[64,18,2,32,0,0],   5:[86,24,2,43,0,0],   6:[108,16,4,27,0,0],
    7:[124,18,4,31,0,0],  8:[154,22,2,38,2,39], 9:[182,22,3,36,2,37],
    10:[216,26,4,43,1,44]
  };
  const ALIN = {1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34],
                7:[6,22,38],8:[6,24,42],9:[6,26,46],10:[6,28,50]};

  const EXP = new Array(512), LOG = new Array(256);
  (() => { let x = 1;
    for(let i=0;i<255;i++){ EXP[i]=x; LOG[x]=i; x<<=1; if(x&0x100) x^=0x11D; }
    for(let i=255;i<512;i++) EXP[i]=EXP[i-255];
  })();
  const mul = (a,b) => (a===0||b===0) ? 0 : EXP[LOG[a]+LOG[b]];

  function genPoly(n){
    let p = [1];
    for(let i=0;i<n;i++){
      const q = new Array(p.length+1).fill(0);
      for(let j=0;j<p.length;j++){
        q[j] ^= mul(p[j], 1);
        q[j+1] ^= mul(p[j], EXP[i]);
      }
      p = q;
    }
    return p;
  }
  function ecBytes(data, n){
    const g = genPoly(n);
    const r = data.concat(new Array(n).fill(0));
    for(let i=0;i<data.length;i++){
      const c = r[i];
      if(!c) continue;
      for(let j=0;j<g.length;j++) r[i+j] ^= mul(g[j], c);
    }
    return r.slice(data.length);
  }

  function bchFormato(v){
    let d = v << 10;
    while(Math.floor(Math.log2(d)) >= 10) d ^= 0x537 << (Math.floor(Math.log2(d)) - 10);
    return ((v << 10) | d) ^ 0x5412;
  }
  function bchVersion(v){
    let d = v << 12;
    while(Math.floor(Math.log2(d)) >= 12) d ^= 0x1F25 << (Math.floor(Math.log2(d)) - 12);
    return (v << 12) | d;
  }

  const MASCARAS = [
    (r,c)=>(r+c)%2===0, (r,c)=>r%2===0, (r,c)=>c%3===0, (r,c)=>(r+c)%3===0,
    (r,c)=>(Math.floor(r/2)+Math.floor(c/3))%2===0, (r,c)=>((r*c)%2)+((r*c)%3)===0,
    (r,c)=>(((r*c)%2)+((r*c)%3))%2===0, (r,c)=>(((r+c)%2)+((r*c)%3))%2===0
  ];

  function utf8(txt){
    const b = [];
    for(const ch of unescape(encodeURIComponent(txt))) b.push(ch.charCodeAt(0));
    return b;
  }

  function generar(texto){
    const datos = utf8(texto);
    let ver = 0;
    for(let v=1;v<=10;v++){ if(datos.length + 2 <= EC[v][0]){ ver = v; break; } }
    if(!ver) throw new Error('El texto es muy largo para este generador.');

    const [totalDatos, ecPorBloque, g1, g1cw, g2, g2cw] = EC[ver];

    /* Flujo de bits */
    const bits = [];
    const push = (val, len) => { for(let i=len-1;i>=0;i--) bits.push((val>>i)&1); };
    push(4, 4);
    push(datos.length, 8);
    datos.forEach(b => push(b, 8));
    for(let i=0;i<4 && bits.length < totalDatos*8;i++) bits.push(0);
    while(bits.length % 8) bits.push(0);
    const cw = [];
    for(let i=0;i<bits.length;i+=8){
      let b = 0; for(let j=0;j<8;j++) b = (b<<1)|bits[i+j];
      cw.push(b);
    }
    const relleno = [0xEC, 0x11];
    let k = 0;
    while(cw.length < totalDatos) cw.push(relleno[k++ % 2]);

    /* Bloques */
    const bloques = [], ecs = [];
    let p = 0;
    for(let i=0;i<g1;i++){ bloques.push(cw.slice(p, p+g1cw)); p += g1cw; }
    for(let i=0;i<g2;i++){ bloques.push(cw.slice(p, p+g2cw)); p += g2cw; }
    bloques.forEach(b => ecs.push(ecBytes(b, ecPorBloque)));

    const final = [];
    const maxD = Math.max(...bloques.map(b => b.length));
    for(let i=0;i<maxD;i++) bloques.forEach(b => { if(i < b.length) final.push(b[i]); });
    for(let i=0;i<ecPorBloque;i++) ecs.forEach(e => final.push(e[i]));

    /* Matriz */
    const n = ver*4 + 17;
    const m = Array.from({length:n}, () => new Array(n).fill(null));
    const reservado = Array.from({length:n}, () => new Array(n).fill(false));
    const poner = (r,c,v) => { m[r][c] = v; reservado[r][c] = true; };

    const finder = (fr,fc) => {
      for(let r=-1;r<=7;r++) for(let c=-1;c<=7;c++){
        const rr = fr+r, cc = fc+c;
        if(rr<0||cc<0||rr>=n||cc>=n) continue;
        const dentro = r>=0&&r<=6&&c>=0&&c<=6;
        const anillo = dentro && (r===0||r===6||c===0||c===6||(r>=2&&r<=4&&c>=2&&c<=4));
        poner(rr, cc, anillo ? 1 : 0);
      }
    };
    finder(0,0); finder(0,n-7); finder(n-7,0);

    for(let i=8;i<n-8;i++){ poner(6,i,(i%2===0)?1:0); poner(i,6,(i%2===0)?1:0); }

    const cent = ALIN[ver];
    cent.forEach(a => cent.forEach(b => {
      if((a===6&&b===6)||(a===6&&b===cent[cent.length-1])||(a===cent[cent.length-1]&&b===6)) return;
      for(let r=-2;r<=2;r++) for(let c=-2;c<=2;c++)
        poner(a+r, b+c, (Math.abs(r)===2||Math.abs(c)===2||(r===0&&c===0)) ? 1 : 0);
    }));

    poner(n-8, 8, 1);
    for(let i=0;i<9;i++){
      if(m[8][i]===null) poner(8,i,0);
      if(m[i][8]===null) poner(i,8,0);
    }
    for(let i=0;i<8;i++){
      if(m[8][n-1-i]===null) poner(8,n-1-i,0);
      if(m[n-1-i][8]===null) poner(n-1-i,8,0);
    }
    if(ver>=7){
      for(let i=0;i<18;i++){
        const r = Math.floor(i/3), c = i%3;
        poner(n-11+c, r, 0); poner(r, n-11+c, 0);
      }
    }

    /* Datos en zigzag */
    let bi = 0, arriba = true;
    const bitDe = i => (i < final.length*8) ? (final[i>>3] >> (7-(i&7))) & 1 : 0;
    for(let col=n-1; col>0; col-=2){
      if(col===6) col--;
      for(let j=0;j<n;j++){
        const fila = arriba ? n-1-j : j;
        for(let d=0;d<2;d++){
          const c = col-d;
          if(reservado[fila][c]) continue;
          m[fila][c] = bitDe(bi++);
        }
      }
      arriba = !arriba;
    }

    /* Máscaras */
    const penal = mm => {
      let p1 = 0, p2 = 0, p3 = 0, oscuros = 0;
      const patron = [1,0,1,1,1,0,1];
      for(let r=0;r<n;r++){
        let run = 1;
        for(let c=1;c<n;c++){
          if(mm[r][c]===mm[r][c-1]) run++; else { if(run>=5) p1 += run-2; run = 1; }
        }
        if(run>=5) p1 += run-2;
      }
      for(let c=0;c<n;c++){
        let run = 1;
        for(let r=1;r<n;r++){
          if(mm[r][c]===mm[r-1][c]) run++; else { if(run>=5) p1 += run-2; run = 1; }
        }
        if(run>=5) p1 += run-2;
      }
      for(let r=0;r<n-1;r++) for(let c=0;c<n-1;c++){
        const v = mm[r][c];
        if(v===mm[r][c+1] && v===mm[r+1][c] && v===mm[r+1][c+1]) p2 += 3;
      }
      const buscar = arr => {
        let t = 0;
        for(let i=0;i+7<=arr.length;i++){
          let ok = true;
          for(let j=0;j<7;j++) if(arr[i+j]!==patron[j]){ ok = false; break; }
          if(!ok) continue;
          const antes = arr.slice(Math.max(0,i-4), i);
          const desp  = arr.slice(i+7, i+11);
          if(antes.length===4 && antes.every(x=>x===0)) t += 40;
          if(desp.length===4 && desp.every(x=>x===0)) t += 40;
        }
        return t;
      };
      for(let r=0;r<n;r++) p3 += buscar(mm[r]);
      for(let c=0;c<n;c++) p3 += buscar(mm.map(f => f[c]));
      mm.forEach(f => f.forEach(v => { if(v) oscuros++; }));
      const pct = oscuros*100/(n*n);
      const p4 = Math.floor(Math.abs(pct-50)/5)*10;
      return p1+p2+p3+p4;
    };

    let mejor = null, mejorP = Infinity, mejorM = 0;
    for(let mask=0;mask<8;mask++){
      const mm = m.map(f => f.slice());
      for(let r=0;r<n;r++) for(let c=0;c<n;c++)
        if(!reservado[r][c] && MASCARAS[mask](r,c)) mm[r][c] ^= 1;

      const fmt = bchFormato((0b00<<3)|mask);
      for(let i=0;i<15;i++){
        const b = (fmt >> (14-i)) & 1;
        if(i<6) mm[8][i] = b;
        else if(i<8) mm[8][i+1] = b;
        else if(i===8) mm[7][8] = b;
        else mm[14-i][8] = b;

        if(i<7) mm[n-1-i][8] = b;
        else mm[8][n-15+i] = b;
      }
      mm[n-8][8] = 1;
      if(ver>=7){
        const vi = bchVersion(ver);
        for(let i=0;i<18;i++){
          const b = (vi >> i) & 1;
          const r = Math.floor(i/3), c = i%3;
          mm[n-11+c][r] = b; mm[r][n-11+c] = b;
        }
      }
      const pe = penal(mm);
      if(pe < mejorP){ mejorP = pe; mejor = mm; mejorM = mask; }
    }
    return mejor;
  }

  function svg(texto, lado){
    const m = generar(texto), n = m.length, q = 4, t = n + q*2;
    let d = '';
    for(let r=0;r<n;r++) for(let c=0;c<n;c++)
      if(m[r][c]) d += `M${c+q} ${r+q}h1v1h-1z`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${t} ${t}" width="${lado}" height="${lado}" shape-rendering="crispEdges">
      <rect width="${t}" height="${t}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }

  return { generar, svg };
})();

/* ── Derivaciones ─────────────────────────────────────────── */
const cuentaDe = mesaId => CUENTAS.find(c => c.mesas.includes(mesaId));
const itemsDe = c => c ? c.comandas.flatMap(k => k.items.filter(i => i.estado !== 'anulado' && k.estado !== 'rechazada' && k.estado !== 'pendiente_aprobacion')) : [];
const totalDe = c => itemsDe(c).reduce((s,i) => s + i.cant * i.precio, 0);
const qrPendientes = c => c ? c.comandas.filter(k => k.estado === 'pendiente_aprobacion') : [];

function estadoDe(mesaId){
  const m = MESAS.find(x => x.id === mesaId);
  const c = cuentaDe(mesaId);
  if(!c) return m.pendienteLimpieza ? 'a_limpiar' : 'libre';
  if(c.cuentaPedida) return 'cuenta';
  const items = itemsDe(c);
  if(items.length === 0) return 'ocupada';
  if(items.some(i => i.estado !== 'entregado')) return 'pidio';
  return 'servida';
}

const ETIQUETAS = {
  libre:'Libre', ocupada:'Ocupada', pidio:'Pidió',
  servida:'Servida', cuenta:'Pidió la cuenta', a_limpiar:'A limpiar'
};
const CLASES = {
  libre:'e-libre', ocupada:'e-ocupada', pidio:'e-pidio',
  servida:'e-servida', cuenta:'e-cuenta', a_limpiar:'e-limpiar'
};
const EST_ITEM = { pendiente:'Sin enviar', en_cocina:'En cocina', listo:'Listo', entregado:'Entregado', anulado:'Anulado' };

const plata = cent => '$' + Math.round(cent/100).toLocaleString('es-AR');
function transcurrido(desde){
  const min = Math.floor((Date.now() - desde)/60000);
  if(min < 60) return min + ' min';
  return Math.floor(min/60) + ' h ' + String(min%60).padStart(2,'0');
}

      const c = cuentaDe(m.id);

      html += `<button class="mesa ${CLASES[est]}${elegida?' elegida':''}${apagada?' apagada':''}" data-mesa="${m.id}">

/* ── Toques sobre la grilla ───────────────────────────────── */
function tocarMesa(id){
  if(ui.modo === 'juntar'){
    if(ui.elegidas.includes(id)) ui.elegidas = ui.elegidas.filter(x => x !== id);
    else ui.elegidas.push(id);
    pintar(); return;
  }
  if(ui.modo === 'mover'){
    if(!ui.elegidas.length){
      if(estadoDe(id) === 'libre'){ tostar('Esa mesa está libre. Elegí la que tiene gente.'); return; }
      ui.elegidas = [id]; pintar(); return;
    }
    moverMesa(ui.elegidas[0], id); return;
  }
  abrirMesa(id);
}

function salirDeModo(){ ui.modo='normal'; ui.elegidas=[]; pintar(); }

function confirmarJuntar(){
  const ids = [...ui.elegidas];
  const cuentas = [...new Set(ids.map(cuentaDe).filter(Boolean))];
  let destino;
  if(cuentas.length === 0){
    destino = { id:nuevoId(), mesas:[], comensales:0, mozo:'Nico', abierta:Date.now(), cuentaPedida:null, comandas:[] };
    CUENTAS.push(destino);
  } else {
    destino = cuentas[0];
    cuentas.slice(1).forEach(c => {
      destino.comandas.push(...c.comandas);
      destino.comensales += c.comensales;
      destino.mesas.push(...c.mesas);
      CUENTAS = CUENTAS.filter(x => x !== c);
    });
  }
  ids.forEach(id => { if(!destino.mesas.includes(id)) destino.mesas.push(id); });
  destino.mesas = [...new Set(destino.mesas)];
  if(!destino.comensales) destino.comensales = destino.mesas.reduce((s,id) => s + MESAS.find(m=>m.id===id).capacidad, 0);
  const nums = destino.mesas.map(id => MESAS.find(m=>m.id===id).numero);
  salirDeModo();
  tostar('Mesas ' + nums.join(' y ') + ' juntadas en una sola cuenta.');
}

function moverMesa(desde, hasta){
  const c = cuentaDe(desde);
  c.mesas = c.mesas.filter(x => x !== desde);
  c.mesas.push(hasta);
  const a = MESAS.find(m=>m.id===desde).numero, b = MESAS.find(m=>m.id===hasta).numero;
  salirDeModo();
  tostar('La mesa ' + a + ' pasó a la ' + b + '. La cuenta se fue con ellos.');
}
