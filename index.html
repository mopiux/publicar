  const est = estadoDe(id);
  const cuerpo = document.getElementById('panelCuerpo');
  const pie = document.getElementById('panelPie');

  const otras = c && c.mesas.length > 1
    ? ' + ' + c.mesas.filter(x => x !== id).map(x => MESAS.find(y=>y.id===x).numero).join(' + ') : '';
  document.getElementById('panelNum').textContent = m.numero + otras;
  document.getElementById('panelTitulo').textContent = ETIQUETAS[est];
  document.getElementById('panelSub').textContent = c
    ? `${c.comensales} personas · abierta hace ${transcurrido(c.abierta)} · atiende ${c.mozo}`
    : `${m.capacidad} lugares · ${m.sector}`;

  /* Mesa sin cuenta */
  if(!c){
    cuerpo.innerHTML = est === 'a_limpiar'
      ? `<div class="nada"><p>Se fueron y falta levantar.</p>
         <small>Nadie puede sentarse acá hasta que alguien la marque limpia.</small></div>`
      : `<div class="nada"><p>Mesa libre.</p><small>Abrila cuando se siente gente.</small></div>`;
    pie.innerHTML = est === 'a_limpiar'
      ? `<div class="botonera"><button class="btn lleno full" id="aLibre">Marcar limpia</button></div>`
      : `<div class="botonera"><button class="btn lleno full" id="abrir">Abrir mesa</button></div>`;
    const b1 = document.getElementById('abrir'); if(b1) b1.onclick = () => pedirComensales(id);
    const b2 = document.getElementById('aLibre'); if(b2) b2.onclick = () => {
      m.pendienteLimpieza = false; cerrarPanel(); pintar(); tostar('Mesa ' + m.numero + ' libre.');
    };
    return;
  }

  /* Mesa con cuenta */
  let html = '';

  qrPendientes(c).forEach(k => {
    html += `<div class="tarjeta-qr">
      <h3>Pedido desde el QR de la mesa</h3>
      <p>Llegó hace ${transcurrido(k.creada)}. Nada va a ${DESTINOS[k.destino]} hasta que lo apruebes.</p>
      ${k.items.map(i => filaItem(i,false)).join('')}
      <div class="botonera">
        <button class="btn mal" data-rechazar="${k.id}">Rechazar</button>
        <button class="btn lleno" data-aprobar="${k.id}">Aprobar y enviar</button>
      </div>
    </div>`;
  });

  const enviadas = c.comandas.filter(k => k.estado === 'enviada');
  const rondas = [...new Set(enviadas.map(k => k.ronda))].sort();
  rondas.forEach(r => {
    enviadas.filter(k => k.ronda === r).forEach(k => {
      html += `<div class="ronda">
        <div class="ronda-cab">
          <span>Pedido ${r}</span>
          <span class="destino">${DESTINOS[k.destino]}</span>
          <span class="sep"></span>
          <span>enviado hace ${transcurrido(k.enviada)}${k.origen==='qr'?' · por QR':''}</span>
        </div>
        ${k.items.map(i => filaItem(i,true)).join('')}
      </div>`;
    });
  });

  const borrador = c.comandas.filter(k => k.estado === 'borrador');
  const itemsSinEnviar = borrador.flatMap(k => k.items);
  if(itemsSinEnviar.length){
    html += `<div class="ronda">
      <div class="ronda-cab"><span>Sin enviar todavía</span><span class="sep"></span></div>
      ${itemsSinEnviar.map(i => filaItem(i,true)).join('')}
    </div>`;
  }

  if(!html) html = `<div class="nada"><p>Todavía no pidieron nada.</p>
    <small>Cargá el pedido cuando el mozo te lo dicte.</small></div>`;

  cuerpo.innerHTML = html;

  const total = totalDe(c);
  let botones = `<button class="btn" id="cargar">Cargar pedido</button>`;
  if(itemsSinEnviar.length) botones += `<button class="btn aviso-btn" id="enviar">Enviar a cocina</button>`;
  else if(itemsDe(c).some(i => i.estado === 'listo')) botones += `<button class="btn" id="entregar">Marcar entregado</button>`;
  else if(!c.cuentaPedida) botones += `<button class="btn" id="pedirCuenta">Pidieron la cuenta</button>`;
  else botones += `<button class="btn" id="pedirCuenta" disabled>Cuenta pedida</button>`;
  if(c.mesas.length > 1) botones += `<button class="btn full" id="separar">Separar las mesas</button>`;
  botones += `<button class="btn lleno full" id="cobrar">Cobrar y cerrar</button>`;

  pie.innerHTML = `<div class="total"><span>Consumido</span><b class="num">${plata(total)}</b></div>
    <div class="botonera">${botones}</div>`;

  cuerpo.querySelectorAll('[data-anular]').forEach(b =>
    b.onclick = () => pedirMotivoAnulacion(b.dataset.anular));
  cuerpo.querySelectorAll('[data-aprobar]').forEach(b =>
    b.onclick = () => aprobarQr(c, b.dataset.aprobar));
  cuerpo.querySelectorAll('[data-rechazar]').forEach(b =>
    b.onclick = () => rechazarQr(c, b.dataset.rechazar));

  const g = id2 => document.getElementById(id2);
  g('cargar').onclick = () => abrirPedido(id);
  if(g('enviar')) g('enviar').onclick = () => enviarACocina(c);
  if(g('entregar')) g('entregar').onclick = () => {
    itemsDe(c).filter(i => i.estado === 'listo').forEach(i => i.estado = 'entregado');
    pintar(); tostar('Entregado. La mesa quedó servida.');
  };
  if(g('pedirCuenta') && !g('pedirCuenta').disabled) g('pedirCuenta').onclick = () => {
    c.cuentaPedida = Date.now(); pintar(); tostar('Mesa ' + m.numero + ' pidió la cuenta.');
  };
  if(g('separar')) g('separar').onclick = () => separarMesas(c);
  g('cobrar').onclick = () => abrirCobro(id);
}

function enviarACocina(c){
  const porDestino = {};
  c.comandas.filter(k => k.estado === 'borrador').forEach(k => {
    k.items.forEach(i => {
      const d = prod(i.pid).destino;
      (porDestino[d] = porDestino[d] || []).push(i);
    });
    c.comandas = c.comandas.filter(x => x !== k);
  });
  const ronda = Math.max(0, ...c.comandas.map(k => k.ronda)) + 1;
  const destinos = [];
  Object.keys(porDestino).forEach(d => {
    porDestino[d].forEach(i => i.estado = 'en_cocina');
    c.comandas.push({ id:nuevoId(), destino:d, ronda, estado:'enviada',
      origen:'caja', enviada:Date.now(), items:porDestino[d] });
    destinos.push(DESTINOS[d]);
  });
  if(!ui.enLinea) ui.enCola += destinos.length;
  pintar();
  tostar(destinos.length > 1
    ? 'Salieron ' + destinos.length + ' comandas: ' + destinos.join(' y ') + '.'
    : 'Comanda enviada a ' + destinos[0] + '.');
}

function aprobarQr(c, kid){
  const k = c.comandas.find(x => x.id === kid);
  k.estado = 'enviada';
  k.enviada = Date.now();
  k.items.forEach(i => i.estado = 'en_cocina');
  pintar();
  tostar('Pedido aprobado. Salió a ' + DESTINOS[k.destino] + '.');
}
function rechazarQr(c, kid){
  abrirModal({
    titulo:'Rechazar el pedido',
    texto:'Se guarda con el motivo. El cliente ve que no se aprobó.',
    opciones:['No es de esta mesa','Pidieron de más','Ya no hay stock','Otro'],
    boton:'Rechazar',
    peligro:true,
    alConfirmar(motivo){
      const k = c.comandas.find(x => x.id === kid);
      k.estado = 'rechazada'; k.motivo = motivo;
      pintar(); tostar('Pedido rechazado y registrado.');
    }
  });
}

function pedirMotivoAnulacion(itemId){
  abrirModal({
    titulo:'Anular el plato',
    texto:'No se borra: queda anulado con tu nombre, el motivo y la hora.',
    opciones:['Error de carga','El cliente se arrepintió','No hay stock','Salió mal','Otro'],
    pin:true,
    boton:'Anular',
    peligro:true,
    alConfirmar(motivo){
      CUENTAS.forEach(c => c.comandas.forEach(k => k.items.forEach(i => {
        if(i.id === itemId){
          i.estado = 'anulado'; i.motivo = motivo;
          i.anuladoPor = 'Marta'; i.anuladoEn = Date.now();
        }
      })));
      pintar();
      if(ped.cuenta) pintarPedido();
      tostar('Anulado. Quedó registrado a nombre de Marta a las ' + new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false}) + '.');
    }
  });
}

function pedirComensales(mesaId){
  abrirModal({
    titulo:'Abrir la mesa',
    texto:'¿Cuántos se sentaron?',
    opciones:['1','2','3','4','5','6','8','10'],
    boton:'Abrir',
    alConfirmar(n){
      CUENTAS.push({ id:nuevoId(), mesas:[mesaId], comensales:Number(n),
        mozo:'Nico', abierta:Date.now(), cuentaPedida:null, comandas:[] });
      pintar();
      tostar('Mesa ' + MESAS.find(m=>m.id===mesaId).numero + ' abierta con ' + n + '.');
    }
  });
}

function separarMesas(c){
  abrirCobro(c.mesas[0]);
  cob.modo = 'items'; armarPartes(c.mesas.length); pintarCobro();
  tostar('Separar mesas con consumo cargado es dividir la cuenta. Repartí los platos y cobrá cada parte.');
}

/* ═══════════════════════════════════════════════════════════
   Armado de pedido (5.2)
   ═══════════════════════════════════════════════════════════ */
const ped = { cuenta:null, rubro:'todos', busca:'' };

const sinTildes = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

function borradorDe(c){
  let k = c.comandas.find(x => x.estado === 'borrador');
  if(!k){
    k = { id:nuevoId(), destino:null, ronda:0, estado:'borrador', origen:'caja', enviada:null, items:[] };
    c.comandas.push(k);
  }
  return k;
}

function abrirPedido(mesaId){
  let c = cuentaDe(mesaId);
  if(!c) return;
  ped.cuenta = c; ped.rubro = 'todos'; ped.busca = '';
  document.getElementById('buscador').value = '';
  cerrarPanel();
  document.getElementById('vistaSalon').hidden = true;
  document.getElementById('vistaPedido').hidden = false;
  const nums = c.mesas.map(id => MESAS.find(m => m.id === id).numero);
  document.getElementById('pedTitulo').textContent = 'Mesa ' + nums.join(' + ');
  document.getElementById('pedSub').textContent = c.comensales + ' personas · atiende ' + c.mozo;
  pintarPedido();
  document.getElementById('carta').scrollTop = 0;
}

function volverAlSalon(){
  document.getElementById('vistaPedido').hidden = true;
  document.getElementById('vistaSalon').hidden = false;
  document.getElementById('ticket').classList.remove('abierto');
  ped.cuenta = null;
  pintar();
}
document.getElementById('btnVolverSalon').onclick = volverAlSalon;

document.getElementById('buscador').oninput = e => { ped.busca = e.target.value.trim(); pintarCarta(); };

function pintarRubros(){
  const cont = document.getElementById('rubros');
  cont.innerHTML = `<button class="chip" data-rubro="todos" aria-pressed="${ped.rubro==='todos'}">Toda la carta</button>` +
    RUBROS.map(r => `<button class="chip" data-rubro="${r}" aria-pressed="${ped.rubro===r}">${r}</button>`).join('');
  cont.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    ped.rubro = b.dataset.rubro;
    document.getElementById('buscador').value = ''; ped.busca = '';
    pintarRubros(); pintarCarta();
    document.getElementById('carta').scrollTop = 0;
  });
}

function llevanDelProducto(pid){
  const k = ped.cuenta.comandas.find(x => x.estado === 'borrador');
  if(!k) return 0;
  return k.items.filter(i => i.pid === pid).reduce((s,i) => s + i.cant, 0);
}

function tarjetaPlato(p){
  const n = llevanDelProducto(p.id);
  if(p.agotado){
    return `<div class="plato agotado">
      <div class="nom">${p.nom}</div>
      <div class="fila"><span class="precio">${plata(p.precio)}</span><span class="sinstock">Agotado</span></div>
    </div>`;
  }
  return `<button class="plato" data-add="${p.id}">
    ${n ? `<span class="llevan">${n} en el pedido</span>` : ''}
    <div class="nom">${p.nom}</div>
    <div class="fila"><span class="precio">${plata(p.precio)}</span><span class="dest">${DESTINOS[p.destino]}</span></div>
  </button>`;
}

function pintarCarta(){
  const cont = document.getElementById('carta');
  let html = '';
  if(ped.busca){
    const q = sinTildes(ped.busca);
    const hallados = CARTA.filter(p => !p.baja && sinTildes(p.nom).includes(q));
    html = hallados.length
      ? `<div class="rubro-tit">${hallados.length} resultado${hallados.length>1?'s':''}</div>
         <div class="rejilla">${hallados.map(tarjetaPlato).join('')}</div>`
      : `<div class="nada"><p>Ningún plato se llama así.</p>
         <small>Probá con una palabra sola, como “mila” o “empanada”.</small></div>`;
  } else {
    const rubros = ped.rubro === 'todos' ? RUBROS : [ped.rubro];
    rubros.forEach(r => {
      const lista = CARTA.filter(p => p.rubro === r && !p.baja);
      if(!lista.length) return;
      html += `<div class="rubro-tit">${r}</div>
        <div class="rejilla">${lista.map(tarjetaPlato).join('')}</div>`;
    });
  }
  cont.innerHTML = html;
  cont.querySelectorAll('[data-add]').forEach(b => b.onclick = () => agregar(b.dataset.add));
}

function agregar(pid){
  const k = borradorDe(ped.cuenta);
  const p = prod(pid);
  const existe = k.items.find(i => i.pid === pid && !i.acl);
  if(existe) existe.cant++;
  else k.items.push({ id:nuevoId(), pid, cant:1, precio:p.precio, acl:'', estado:'pendiente' });
  pintarPedido();
}

function cambiarCantidad(itemId, delta){
  const k = borradorDe(ped.cuenta);
  const i = k.items.find(x => x.id === itemId);
  if(!i) return;
  i.cant += delta;
  if(i.cant <= 0) k.items = k.items.filter(x => x !== i);
  pintarPedido();
}

function pintarTicket(){
  const c = ped.cuenta;
  const k = c.comandas.find(x => x.estado === 'borrador');
  const nuevos = k ? k.items : [];
  const enviados = c.comandas.filter(x => x.estado === 'enviada')
    .flatMap(x => x.items.map(i => ({...i, destino:x.destino, ronda:x.ronda})));

  const lista = document.getElementById('ticketLista');
  let html = '';

  if(nuevos.length){
    html += nuevos.map(i => {
      const p = prod(i.pid);
      return `<div class="linea">
        <div class="contador">
          <button data-menos="${i.id}" aria-label="Uno menos">−</button>
          <span class="v">${i.cant}</span>
          <button data-mas="${i.id}" aria-label="Uno más">+</button>
        </div>
        <div class="txt">
          <b>${p.nom}</b>
          ${i.acl
            ? `<div class="acl">${i.acl} · <button data-acl="${i.id}">cambiar</button></div>`
            : `<button class="ponerAcl" data-acl="${i.id}">Agregar aclaración</button>`}
        </div>
        <div class="der"><span class="precio">${plata(i.cant*i.precio)}</span></div>
      </div>`;
    }).join('');
  } else {
    html += `<div class="nada"><p>Todavía no cargaste nada.</p>
      <small>Tocá un plato de la carta para sumarlo.</small></div>`;
  }

  if(enviados.length){
    html += `<div class="ya"><div class="ya-cab">Ya está en cocina</div>` +
      enviados.map(i => {
        const p = prod(i.pid);
        return `<div class="linea">
          <div class="contador"><span class="v">${i.cant}</span></div>
          <div class="txt"><b>${p.nom}</b>
            ${i.acl ? `<div class="acl">${i.acl}</div>` : ''}
            <div class="ponerAcl" style="text-decoration:none">${DESTINOS[i.destino]} · ${EST_ITEM[i.estado]}</div>
          </div>
          <div class="der"><span class="precio">${plata(i.cant*i.precio)}</span>
            ${i.estado!=='anulado' ? `<button class="mini" data-anular="${i.id}">Anular</button>` : ''}
          </div>
        </div>`;
      }).join('') + `</div>`;
  }

  lista.innerHTML = html;
  lista.querySelectorAll('[data-mas]').forEach(b => b.onclick = () => cambiarCantidad(b.dataset.mas, 1));
  lista.querySelectorAll('[data-menos]').forEach(b => b.onclick = () => cambiarCantidad(b.dataset.menos, -1));
  lista.querySelectorAll('[data-acl]').forEach(b => b.onclick = () => pedirAclaracion(b.dataset.acl));
  lista.querySelectorAll('[data-anular]').forEach(b => b.onclick = () => pedirMotivoAnulacion(b.dataset.anular));

  const totalNuevo = nuevos.reduce((s,i) => s + i.cant*i.precio, 0);
  const destinos = [...new Set(nuevos.map(i => prod(i.pid).destino))];

  document.getElementById('ticketCab').textContent = nuevos.length
    ? 'Pedido nuevo, sin enviar' : 'Pedido nuevo';

  document.getElementById('ticketPie').innerHTML = `
    ${destinos.length > 1 ? `<div class="reparto">Sale en ${destinos.length} comandas:
      ${destinos.map(d => `<span>${DESTINOS[d]}</span>`).join('')}</div>` : ''}
    <div class="total"><span>A enviar</span><b class="num">${plata(totalNuevo)}</b></div>
    <button class="btn lleno ancho" id="btnEnviar" ${nuevos.length?'':'disabled'}>Enviar a cocina</button>`;

  const be = document.getElementById('btnEnviar');
  if(be && nuevos.length) be.onclick = () => {
    enviarACocina(ped.cuenta);
    volverAlSalon();
  };

  document.getElementById('abrirTicket').innerHTML = nuevos.length
    ? `<span>${nuevos.reduce((s,i)=>s+i.cant,0)} ítems sin enviar</span>
       <span class="plata num">${plata(totalNuevo)}</span>
       <button class="btn lleno" id="verTicket">Ver pedido</button>`
    : `<span>Tocá un plato para empezar el pedido</span>
       <button class="btn" id="verTicket">Ver mesa</button>`;
  document.getElementById('verTicket').onclick = () =>
    document.getElementById('ticket').classList.toggle('abierto');
}

function pintarPedido(){ pintarRubros(); pintarCarta(); pintarTicket(); }

function pedirAclaracion(itemId){
  const k = borradorDe(ped.cuenta);
  const i = k.items.find(x => x.id === itemId);
  if(!i) return;
  const p = prod(i.pid);
  const caja = document.getElementById('cajaModal');
  caja.innerHTML = `<h3>${p.nom}</h3>
    <p>Lo que escribas acá sale impreso en la comanda de ${DESTINOS[p.destino]}.</p>
    <div class="opciones" id="ops">${ACLARACIONES.map(a => `<button data-op="${a}">${a}</button>`).join('')}</div>
    <input type="text" id="txtAcl" placeholder="O escribilo vos" value="${i.acl.replace(/"/g,'&quot;')}">
    <div class="botonera">
      <button class="btn" id="mCancelar">Cancelar</button>
      <button class="btn lleno" id="mOk">Guardar</button>
    </div>`;
  document.getElementById('modal').classList.add('abierto');
  const campo = document.getElementById('txtAcl');
  caja.querySelectorAll('#ops button').forEach(b => b.onclick = () => {
    const actual = campo.value.trim();
    campo.value = actual ? actual + ', ' + b.dataset.op : b.dataset.op;
  });
  document.getElementById('mCancelar').onclick = cerrarModal;
  document.getElementById('mOk').onclick = () => {
    const v = campo.value.trim();
    /* Si el ítem tenía cantidad > 1, la aclaración separa una unidad. */
    if(v && i.cant > 1){
      i.cant--;
      k.items.push({ id:nuevoId(), pid:i.pid, cant:1, precio:i.precio, acl:v, estado:'pendiente' });
    } else {
      i.acl = v;
    }
    cerrarModal();
    pintarPedido();
  };
}


/* ═══════════════════════════════════════════════════════════
   Cocina (5.4)
   Umbrales: hasta 6 min normal, hasta 12 ámbar, más rojo.
   ═══════════════════════════════════════════════════════════ */
const UMBRAL_MEDIO = 6, UMBRAL_TARDE = 12;
const coc = { destino:'todos' };

function comandasDeCocina(){
  const salida = [];
  CUENTAS.forEach(c => {
    c.comandas.forEach(k => {
      if(k.estado !== 'enviada') return;
      const vivos = k.items.filter(i => i.estado === 'en_cocina' || i.estado === 'listo');
      if(!vivos.length) return;
      salida.push({
        k, c, items:vivos,
        mesas:c.mesas.map(id => MESAS.find(m => m.id === id).numero),
        min:Math.floor((Date.now() - k.enviada)/60000),
        lista:vivos.every(i => i.estado === 'listo')
      });
    });
  });
  return salida.sort((a,b) => a.k.enviada - b.k.enviada);
}

function irACocina(){
  document.getElementById('vistaSalon').hidden = true;
  document.getElementById('vistaPedido').hidden = true;
  document.getElementById('vistaCocina').hidden = false;
  pintarCocina();
}
document.getElementById('btnCocina').onclick = irACocina;
document.getElementById('btnDueno').onclick = abrirDueno;
document.getElementById('btnVolverDeCocina').onclick = () => {
  document.getElementById('vistaCocina').hidden = true;
  document.getElementById('vistaSalon').hidden = false;
  pintar();
};

function pintarDestinos(){
  const todas = comandasDeCocina();
  const cont = document.getElementById('destinos');
  const cuenta = d => todas.filter(x => x.k.destino === d && !x.lista).length;
  cont.innerHTML =
    `<button class="chip" data-d="todos" aria-pressed="${coc.destino==='todos'}">
      Todo <span class="cant num">${todas.filter(x=>!x.lista).length}</span></button>` +
    Object.keys(DESTINOS).map(d =>
      `<button class="chip" data-d="${d}" aria-pressed="${coc.destino===d}">
        ${DESTINOS[d]} <span class="cant num">${cuenta(d)}</span></button>`).join('');
  cont.querySelectorAll('.chip').forEach(b =>
    b.onclick = () => { coc.destino = b.dataset.d; pintarCocina(); });
}

function tarjetaComanda(x){
  const clase = x.lista ? 'c-lista' : x.min >= UMBRAL_TARDE ? 'c-tarde' : x.min >= UMBRAL_MEDIO ? 'c-media' : '';
  return `<article class="comanda ${clase}">
    <div class="comanda-cab">
      <div>
        <div class="nro num">${x.mesas.join('+')}</div>
        <div class="meta">${DESTINOS[x.k.destino]} · pedido ${x.k.ronda}${x.k.origen==='qr'?' · por QR':''}</div>
      </div>
      <div class="espera num">${x.min}<small>min ${x.lista?'lista':'esperando'}</small></div>
    </div>
    <div class="comanda-items">
      ${x.items.map(i => `<button class="plato-fila ${i.estado==='listo'?'hecho':''}" data-item="${i.id}">
        <span class="c num">${i.cant}</span>
        <span class="t"><b>${prod(i.pid).nom}</b>${i.acl?`<span class="acl">${i.acl}</span>`:''}</span>
        <span class="tilde">✓</span>
      </button>`).join('')}
    </div>
    <div class="comanda-pie">
      ${x.lista
        ? `<button class="btn" data-desmarcar="${x.k.id}">Todavía no está</button>`
        : `<button class="btn lleno" data-toda="${x.k.id}">Comanda lista</button>`}
    </div>
  </article>`;
}

function pintarCocina(){
  pintarDestinos();
  const todas = comandasDeCocina()
    .filter(x => coc.destino === 'todos' || x.k.destino === coc.destino);
  const pendientes = todas.filter(x => !x.lista);
  const listas = todas.filter(x => x.lista);
  const cont = document.getElementById('tablero');

  let html = '';
  if(pendientes.length){
    html += `<div class="bloque-tit">Preparando</div>
      <div class="tablero-grilla">${pendientes.map(tarjetaComanda).join('')}</div>`;
  } else {
    html += `<div class="nada"><p>No hay nada esperando.</p>
      <small>Las comandas nuevas entran acá solas, la más vieja primero.</small></div>`;
  }
  if(listas.length){
    html += `<div class="bloque-tit">Listas para levantar</div>
      <div class="tablero-grilla">${listas.map(tarjetaComanda).join('')}</div>`;
  }
  cont.innerHTML = html;

  cont.querySelectorAll('[data-item]').forEach(b => b.onclick = () => {
    const i = buscarItem(b.dataset.item);
    i.estado = i.estado === 'listo' ? 'en_cocina' : 'listo';
    pintarCocina();
  });
  cont.querySelectorAll('[data-toda]').forEach(b => b.onclick = () => {
    const k = buscarComanda(b.dataset.toda);
    k.items.forEach(i => { if(i.estado === 'en_cocina') i.estado = 'listo'; });
    pintarCocina();
    tostar('Comanda lista. El mozo la ve en el salón.');
  });
  cont.querySelectorAll('[data-desmarcar]').forEach(b => b.onclick = () => {
    const k = buscarComanda(b.dataset.desmarcar);
    k.items.forEach(i => { if(i.estado === 'listo') i.estado = 'en_cocina'; });
    pintarCocina();
  });
}

function buscarItem(id){
  for(const c of CUENTAS) for(const k of c.comandas)
    for(const i of k.items) if(i.id === id) return i;
}
function buscarComanda(id){
  for(const c of CUENTAS) { const k = c.comandas.find(x => x.id === id); if(k) return k; }
}

function contadorCocina(){
  const n = comandasDeCocina().filter(x => !x.lista).length;
  document.getElementById('txtCocina').textContent = n ? 'Cocina · ' + n : 'Cocina';
  const tarde = comandasDeCocina().some(x => !x.lista && x.min >= UMBRAL_TARDE);
  document.getElementById('btnCocina').classList.toggle('off', tarde);
}

/* ═══════════════════════════════════════════════════════════
   Cobro, división de cuenta y cierre (5.3)
   Regla: no se cierra una mesa con plata faltante ni con
   consumo sin asignar.
   ═══════════════════════════════════════════════════════════ */
const cob = { cuenta:null, modo:'junto', partes:[], activa:0 };

function itemsCobrables(c){
  return c.comandas
    .filter(k => k.estado === 'enviada' || k.estado === 'borrador')
    .flatMap(k => k.items.filter(i => i.estado !== 'anulado'));
}
function itemsAnulados(c){
  return c.comandas.flatMap(k => k.items.filter(i => i.estado === 'anulado'));
}
const consumido = c => itemsCobrables(c).reduce((s,i) => s + i.cant*i.precio, 0);
const aCobrar   = c => consumido(c) - (c.descuento ? c.descuento.monto : 0);
const pagado    = c => (c.pagos||[]).reduce((s,p) => s + p.monto, 0);
const propinas  = c => (c.pagos||[]).reduce((s,p) => s + p.propina, 0);
const falta     = c => aCobrar(c) - pagado(c);

function abrirCobro(mesaId){
  const c = cuentaDe(mesaId);
  if(!c) return;
  if(!c.pagos) c.pagos = [];
  if(!c.descuento) c.descuento = { monto:0, motivo:'' };
  const sinEnviar = c.comandas.filter(k => k.estado === 'borrador').flatMap(k => k.items).length;
  if(sinEnviar) tostar('Ojo: hay ' + sinEnviar + ' ítem(s) cargados que nunca salieron a cocina. Se cobran igual.');

  cob.cuenta = c; cob.modo = 'junto'; cob.activa = 0;
  armarPartes();
  cerrarPanel();
  document.getElementById('vistaSalon').hidden = true;
  document.getElementById('vistaCobro').hidden = false;
  const nums = c.mesas.map(id => MESAS.find(m => m.id === id).numero);
  document.getElementById('cbTitulo').textContent = 'Cobrar mesa ' + nums.join(' + ');
  document.getElementById('cbSub').textContent = c.comensales + ' personas · abierta hace ' + transcurrido(c.abierta);
  pintarCobro();
}
document.getElementById('btnVolverDeCobro').onclick = () => {
  document.getElementById('vistaCobro').hidden = true;
  document.getElementById('vistaSalon').hidden = false;
  cob.cuenta = null;
  pintar();
};

function armarPartes(n){
  const c = cob.cuenta;
  if(cob.modo === 'junto'){
    cob.partes = [{ nombre:'La mesa entera', fijo:aCobrar(c), asigna:{}, pago:null }];
    return;
  }
  const cuantas = n || Math.max(2, cob.partes.length || c.comensales || 2);
  const base = cob.modo === 'iguales' ? Math.floor(aCobrar(c)/cuantas) : 0;
  const resto = cob.modo === 'iguales' ? aCobrar(c) - base*cuantas : 0;
  cob.partes = Array.from({length:cuantas}, (_,j) => ({
    nombre:'Persona ' + (j+1),
    fijo: cob.modo === 'iguales' ? base + (j === 0 ? resto : 0) : null,
    asigna:{}, pago:null
  }));
  cob.activa = 0;
}

const asignadasDe = itemId => cob.partes.reduce((s,p) => s + (p.asigna[itemId]||0), 0);
function montoParte(p){
  if(p.fijo !== null && p.fijo !== undefined) return p.fijo;
  return Object.keys(p.asigna).reduce((s,id) => {
    const i = buscarItem(id);
    return s + (i ? p.asigna[id]*i.precio : 0);
  }, 0);
}
function sinAsignar(){
  return itemsCobrables(cob.cuenta).reduce((s,i) => s + (i.cant - asignadasDe(i.id)), 0);
}

function pintarConsumo(){
  const c = cob.cuenta;
  const cont = document.getElementById('cbConsumo');
  const porItems = cob.modo === 'items';
  let html = `<div class="cb-tit">Consumido</div>`;

  itemsCobrables(c).forEach(i => {
    const p = prod(i.pid);
    const libres = i.cant - asignadasDe(i.id);
    html += `<div class="cb-fila">
      <span class="c num">${i.cant}</span>
      <span class="t"><b>${p.nom}</b>${i.acl?`<span class="acl">${i.acl}</span>`:''}
      ${porItems ? `<span class="cb-repartir">
        ${cob.partes.map((pa,j) => {
          const t = pa.asigna[i.id]||0;
          return `<button data-asig="${i.id}" data-parte="${j}" class="${t?'tiene':''}">${pa.nombre.replace('Persona','P')}${t?' · '+t:''}</button>`;
        }).join('')}
        ${libres ? `<button class="" style="pointer-events:none;border-style:dashed">quedan ${libres}</button>` : ''}
      </span>` : ''}
      </span>
      <span class="p">${plata(i.cant*i.precio)}</span>
    </div>`;
  });

  const anulados = itemsAnulados(c);
  if(anulados.length){
    html += `<div class="cb-tit arriba">Anulado, no se cobra</div>`;
    anulados.forEach(i => {
      html += `<div class="cb-fila anulada">
        <span class="c num">${i.cant}</span>
        <span class="t"><b>${prod(i.pid).nom}</b>
        <span class="acl">${i.anuladoPor}: ${i.motivo}</span></span>
        <span class="p">${plata(i.cant*i.precio)}</span>
      </div>`;
    });
  }

  if(porItems && sinAsignar()){
    html += `<div class="cb-sobra">Faltan repartir ${sinAsignar()} ítem(s).
      Tocá el nombre de la persona debajo de cada plato. No se puede cerrar la mesa hasta que no quede nada suelto.</div>`;
  }
  cont.innerHTML = html;

  cont.querySelectorAll('[data-asig]').forEach(b => b.onclick = () => {
    const id = b.dataset.asig, j = Number(b.dataset.parte);
    const i = buscarItem(id), p = cob.partes[j];
    const tiene = p.asigna[id]||0;
    if(asignadasDe(id) < i.cant) p.asigna[id] = tiene + 1;   /* suma una unidad */
    else if(tiene) p.asigna[id] = tiene - 1;                  /* si ya no queda, devuelve */
    else { tostar('Ese plato ya está todo repartido. Sacáselo antes a otra persona.'); return; }
    if(!p.asigna[id]) delete p.asigna[id];
    pintarCobro();
  });
}

function pintarPartes(){
  const c = cob.cuenta;
  document.getElementById('cbModos').innerHTML = `
    <button data-modo="junto"   aria-pressed="${cob.modo==='junto'}">Todo junto</button>
    <button data-modo="iguales" aria-pressed="${cob.modo==='iguales'}">Partes iguales</button>
    <button data-modo="items"   aria-pressed="${cob.modo==='items'}">Cada uno lo suyo</button>`;
  document.getElementById('cbModos').querySelectorAll('button').forEach(b =>
    b.onclick = () => {
      if(c.pagos.length){ tostar('Ya hay pagos hechos. Anulá la mesa o seguí con esta división.'); return; }
      cob.modo = b.dataset.modo; armarPartes(); pintarCobro();
    });

  const cuantos = document.getElementById('cbCuantos');
  if(cob.modo === 'junto'){ cuantos.innerHTML = ''; }
  else {
    cuantos.innerHTML = `<div class="cb-cuantos">
      <span>¿Entre cuántos?</span>
      <span class="contador">
        <button id="menosP" aria-label="Uno menos">−</button>
        <span class="v">${cob.partes.length}</span>
        <button id="masP" aria-label="Uno más">+</button>
      </span></div>`;
    document.getElementById('masP').onclick = () => { armarPartes(cob.partes.length+1); pintarCobro(); };
    document.getElementById('menosP').onclick = () => {
      if(cob.partes.length <= 2) return;
      armarPartes(cob.partes.length-1); pintarCobro();
    };
  }

  document.getElementById('cbPartes').innerHTML = cob.partes.map((p,j) => {
    const m = montoParte(p);
    const detalle = p.pago
      ? p.pago.metodo + (p.pago.propina ? ' · propina ' + plata(p.pago.propina) : '')
      : cob.modo === 'items'
        ? Object.keys(p.asigna).reduce((s,id) => s + p.asigna[id], 0) + ' ítems'
        : '';
    return `<div class="cb-parte ${p.pago?'pagada':''}">
      <span class="nom">${p.nombre}${detalle?`<small>${detalle}</small>`:''}</span>
      <span class="mon num">${plata(m)}</span>
      ${p.pago
        ? `<button class="btn mal" data-deshacer="${j}">Deshacer</button>`
        : `<button class="btn lleno" data-cobrar="${j}" ${m<=0?'disabled':''}>Cobrar</button>`}
    </div>`;
  }).join('');

  document.getElementById('cbPartes').querySelectorAll('[data-cobrar]').forEach(b =>
    b.onclick = () => cobrarParte(Number(b.dataset.cobrar)));
  document.getElementById('cbPartes').querySelectorAll('[data-deshacer]').forEach(b =>
    b.onclick = () => {
      const p = cob.partes[Number(b.dataset.deshacer)];
      c.pagos = c.pagos.filter(x => x !== p.pago);
      p.pago = null; pintarCobro();
    });
}

function pintarPie(){
  const c = cob.cuenta;
  const f = falta(c), sobra = cob.modo === 'items' ? sinAsignar() : 0;
  const puede = f <= 0 && sobra === 0;
  document.getElementById('cbPie').innerHTML = `
    <div class="cb-cuentas">
      <div><span>Consumido</span><span class="num">${plata(consumido(c))}</span></div>
      ${c.descuento.monto ? `<div><span>Descuento · ${c.descuento.motivo}</span><span class="num">−${plata(c.descuento.monto)}</span></div>` : ''}
      ${propinas(c) ? `<div><span>Propina</span><span class="num">${plata(propinas(c))}</span></div>` : ''}
      <div class="fuerte"><span>A cobrar</span><span class="num">${plata(aCobrar(c))}</span></div>
      <div><span>Cobrado</span><span class="num">${plata(pagado(c))}</span></div>
      <div class="${f>0?'falta':'listo'}"><span>${f>0?'Falta':'Cuenta saldada'}</span><span class="num">${f>0?plata(f):'✓'}</span></div>
    </div>
    <div class="cb-acciones">
      <button class="btn" id="cbDescuento">Descuento</button>
      <button class="btn" id="cbImprimir">Imprimir cuenta</button>
      <button class="btn lleno full" id="cbCerrar" ${puede?'':'disabled'}>Cerrar mesa y liberar</button>
    </div>`;
  document.getElementById('cbDescuento').onclick = pedirDescuento;
  document.getElementById('cbImprimir').onclick = imprimirCuenta;
  if(puede) document.getElementById('cbCerrar').onclick = cerrarMesa;
}

function pintarCobro(){ pintarConsumo(); pintarPartes(); pintarPie(); }

function cobrarParte(j){
  const c = cob.cuenta, p = cob.partes[j], monto = montoParte(p);
  let metodo = 'Efectivo', propina = 0, recibido = 0;

  const dibujar = () => {
    const vuelto = recibido - (monto + propina);
    document.getElementById('cajaModal').innerHTML = `
      <h3>${p.nombre}</h3>
      <p>Cobrar ${plata(monto)}${propina?' más '+plata(propina)+' de propina':''}.</p>
      <label>Cómo paga</label>
      <div class="opciones" id="met">
        ${['Efectivo','Tarjeta','Transferencia'].map(x =>
          `<button data-m="${x}" aria-pressed="${metodo===x}">${x}</button>`).join('')}
      </div>
      <label>Propina</label>
      <div class="opciones" id="pro">
        ${[0,10,15].map(x => `<button data-p="${x}" aria-pressed="${propina===Math.round(monto*x/100)&&(x||!propina)}">${x?x+'%':'Sin propina'}</button>`).join('')}
      </div>
      ${metodo === 'Efectivo' ? `
        <label for="rec">Con cuánto paga</label>
        <input type="number" id="rec" inputmode="numeric" placeholder="0" value="${recibido?Math.round(recibido/100):''}">
        <div class="cb-vuelto"><span>Vuelto</span>
          <b class="${vuelto<0?'corto':''}">${recibido?plata(Math.abs(vuelto)):'—'}${vuelto<0&&recibido?' de menos':''}</b></div>` : ''}
      <div class="botonera">
        <button class="btn" id="mCancelar">Cancelar</button>
        <button class="btn lleno" id="mOk" ${metodo==='Efectivo'&&recibido&&vuelto<0?'disabled':''}>Cobrado</button>
      </div>`;

    const caja = document.getElementById('cajaModal');
    caja.querySelectorAll('#met button').forEach(b => b.onclick = () => { metodo = b.dataset.m; dibujar(); });
    caja.querySelectorAll('#pro button').forEach(b => b.onclick = () => {
      propina = Math.round(monto * Number(b.dataset.p) / 100); dibujar();
    });
    const rec = document.getElementById('rec');
    if(rec) rec.oninput = e => {
      recibido = Math.round(Number(e.target.value||0)) * 100;
      const v = recibido - (monto + propina);
      const b = caja.querySelector('.cb-vuelto b');
      b.textContent = recibido ? plata(Math.abs(v)) + (v<0?' de menos':'') : '—';
      b.classList.toggle('corto', v < 0);
      document.getElementById('mOk').disabled = recibido > 0 && v < 0;
    };
    document.getElementById('mCancelar').onclick = cerrarModal;
    document.getElementById('mOk').onclick = () => {
      p.pago = { metodo, monto, propina, confirmado:metodo !== 'Transferencia', creado:Date.now() };
      c.pagos.push(p.pago);
      cerrarModal(); pintarCobro();
      tostar(metodo === 'Transferencia'
        ? 'Anotado como transferencia. Confirmá en el celular que la plata llegó.'
        : 'Cobrado ' + plata(monto + propina) + ' en ' + metodo.toLowerCase() + '.');
    };
  };
  dibujar();
  document.getElementById('modal').classList.add('abierto');
}

function pedirDescuento(){
  const c = cob.cuenta;
  abrirModal({
    titulo:'Descuento sobre la cuenta',
    texto:'Queda registrado con tu nombre, el motivo y la hora, igual que una anulación.',
    opciones:['5%','10%','15%','El plato que salió mal','Otro'],
    pin:true,
    boton:'Aplicar',
    alConfirmar(v){
      const pct = parseInt(v);
      c.descuento = {
        monto: pct ? Math.round(consumido(c)*pct/100) : Math.round(consumido(c)*0.1),
        motivo: pct ? 'descuento del ' + v : v
      };
      if(!c.pagos.length) armarPartes(cob.modo==='junto'?null:cob.partes.length);
      pintarCobro();
      tostar('Descuento aplicado y registrado a nombre de Marta.');
    }
  });
}

function imprimirCuenta(){
  const c = cob.cuenta;
  const nums = c.mesas.map(id => MESAS.find(m => m.id === id).numero);
  const linea = (n,v) => `<div class="l"><span class="n">${n}</span><span>${v}</span></div>`;
  document.getElementById('impresion').innerHTML = `
    <h1>${LOCAL.nombre}</h1>
    <div class="sub">${LOCAL.direccion} · ${LOCAL.ciudad}<br>
      Mesa ${nums.join(' + ')} · ${c.comensales} personas<br>
      ${new Date().toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short',hour12:false})}</div>
    <hr>
    ${itemsCobrables(c).map(i =>
      linea(i.cant + '  ' + prod(i.pid).nom, plata(i.cant*i.precio))).join('')}
    <hr>
    ${linea('Subtotal', plata(consumido(c)))}
    ${c.descuento.monto ? linea('Descuento', '−' + plata(c.descuento.monto)) : ''}
    ${propinas(c) ? linea('Propina', plata(propinas(c))) : ''}
    <div class="l tot"><span class="n">TOTAL</span><span>${plata(aCobrar(c)+propinas(c))}</span></div>
    <hr>
    <div class="legal">Este comprobante no es factura<br>ni válido como comprobante fiscal.<br>Gracias por su visita.</div>`;
  window.print();
}

function cerrarMesa(){
  const c = cob.cuenta;
  const nums = c.mesas.map(id => MESAS.find(m => m.id === id).numero);
  c.mesas.forEach(id => MESAS.find(m => m.id === id).pendienteLimpieza = true);
  CUENTAS = CUENTAS.filter(x => x !== c);
  cob.cuenta = null;
  document.getElementById('vistaCobro').hidden = true;
  document.getElementById('vistaSalon').hidden = false;
  pintar();
  tostar('Mesa ' + nums.join(' y ') + ' cobrada. Queda a limpiar.');
}

   Datos del local. Esto es lo único que hay que cambiar para
   presentarle el sistema a otro restaurante.

  /* Poné las fotos en una carpeta "fotos" al lado de este archivo,

};
function fondoPlato(p){

function fotoHTML(p){

}

/* ═══════════════════════════════════════════════════════════
   Carta pública por QR (5.5)
   ═══════════════════════════════════════════════════════════ */
const tokenDe = numero => 'k' + ((numero*7919) % 9973).toString(36);
const urlBase = () => location.href.split('?')[0].split('#')[0];
const urlMesa = numero => urlBase() + '?m=' + numero + '&t=' + tokenDe(numero);

const cli = { mesa:null, rubro:'todos', carrito:{}, vista:'carta', enviado:false };

function abrirCliente(numero){
  const m = MESAS.find(x => x.numero === numero);
  if(!m) return false;
  cli.mesa = m; cli.carrito = {}; cli.vista = 'carta'; cli.enviado = false;
  document.getElementById('vistaSalon').hidden = true;
  ['vistaPedido','vistaCocina','vistaCobro','vistaQR'].forEach(v => document.getElementById(v).hidden = true);
  document.getElementById('vistaCliente').hidden = false;
  document.getElementById('clNombre').textContent = LOCAL.nombre;
  document.getElementById('clMesa').textContent = 'Mesa ' + m.numero + ' · ' + LOCAL.ciudad;
  pintarCliente();
  return true;
}
document.getElementById('clCambiar').onclick = () => {
  cli.vista = cli.vista === 'carta' ? 'mesa' : 'carta';
  document.getElementById('clCambiar').textContent = cli.vista === 'carta' ? 'Mi mesa' : 'Ver la carta';
  pintarCliente();
};

function pintarCliente(){
  const cuerpo = document.getElementById('clCuerpo');
  const rubros = document.getElementById('clRubros');
  const barra = document.getElementById('clBarra');

  if(cli.vista === 'mesa'){
    rubros.style.display = 'none';
    const c = cuentaDe(cli.mesa.id);
    const items = c ? itemsDe(c) : [];
    let html = '';
    if(cli.enviado) html += `<div class="cl-ok">Tu pedido llegó a la caja. Lo confirman en un momento.</div>`;
    if(!items.length){
      html += `<div class="nada"><p>Todavía no hay nada cargado en esta mesa.</p>
        <small>Lo que pidas aparece acá cuando lo confirman.</small></div>`;
    } else {
      html += `<div class="cb-tit">Lo que lleva la mesa</div>`;
      items.forEach(i => {
        html += `<div class="cb-fila"><span class="c num">${i.cant}</span>
          <span class="t"><b>${prod(i.pid).nom}</b>${i.acl?`<span class="acl">${i.acl}</span>`:''}</span>
          <span class="p">${plata(i.cant*i.precio)}</span></div>`;
      });
      html += `<div class="cb-cuentas" style="margin-top:16px">
        <div class="fuerte"><span>Total hasta ahora</span><span class="num">${plata(totalDe(c))}</span></div></div>`;
    }
    html += `<div class="botonera" style="margin-top:20px">
      <button class="btn" id="clMozo">Llamar al mozo</button>
      <button class="btn" id="clCuenta" ${c&&c.cuentaPedida?'disabled':''}>
        ${c&&c.cuentaPedida?'Cuenta pedida':'Pedir la cuenta'}</button>
    </div>`;
    cuerpo.innerHTML = html;
    barra.innerHTML = `<span>Precios con IVA. Este resumen no es factura.</span>`;
    document.getElementById('clMozo').onclick = () => tostar('Listo, avisamos al mozo. Ya viene.');
    const bc = document.getElementById('clCuenta');
    if(bc && !bc.disabled) bc.onclick = () => {
      const cc = cuentaDe(cli.mesa.id);
      if(!cc){ tostar('Todavía no hay nada para cobrar.'); return; }
      cc.cuentaPedida = Date.now(); pintarCliente();
      tostar('Pedimos la cuenta. El mozo se acerca.');
    };
    return;
  }

  rubros.style.display = '';
  rubros.innerHTML = `<button class="chip" data-r="todos" aria-pressed="${cli.rubro==='todos'}">Todo</button>` +
    RUBROS.map(r => `<button class="chip" data-r="${r}" aria-pressed="${cli.rubro===r}">${r}</button>`).join('');
  rubros.querySelectorAll('.chip').forEach(b =>
    b.onclick = () => { cli.rubro = b.dataset.r; pintarCliente(); document.getElementById('clCuerpo').scrollTop = 0; });

  const rubrosAMostrar = cli.rubro === 'todos' ? RUBROS : [cli.rubro];
  let html = '';
  rubrosAMostrar.forEach(r => {
    const lista = CARTA.filter(p => p.rubro === r && !p.baja);
    if(!lista.length) return;
    html += `<div class="cl-rubro">${r}</div><div class="cl-panel">`;
    lista.forEach(p => {
      const n = cli.carrito[p.id] || 0;
      const et = p.agotado ? 'div' : 'button';
      html += `<${et} class="cl-plato ${p.agotado?'agotado':''}" ${p.agotado?'':`data-add="${p.id}"`}>
        ${fotoHTML(p)}
        <span class="info">
          <b>${p.nom}</b>
          <span class="guia"></span>
          ${p.agotado ? '<span class="nostock">Hoy no hay</span>'
                      : `<span class="pr">${plata(p.precio)}</span>`}
        </span>
        ${p.agotado ? '' : `<span class="mas ${n?'tiene':''}">${n||'+'}</span>`}
      </${et}>`;
    });
    html += `</div>`;
  });
  html += `<div class="cl-pie">${LOCAL.direccion}<br><span>${LOCAL.telefono}</span></div>`;
  cuerpo.innerHTML = html;
  cuerpo.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
    const id = b.dataset.add;
    cli.carrito[id] = (cli.carrito[id]||0) + 1;
    pintarCliente();
  });

  const cant = Object.values(cli.carrito).reduce((s,v) => s+v, 0);
  const tot = Object.keys(cli.carrito).reduce((s,id) => s + cli.carrito[id]*prod(id).precio, 0);
  barra.innerHTML = cant
    ? `<span>${cant} ítem${cant>1?'s':''}</span><span class="plata num">${plata(tot)}</span>
       <button class="btn" id="clVaciar">Vaciar</button>
       <button class="btn lleno" id="clEnviar">Pedir</button>`
    : `<span>Tocá un plato para armar tu pedido</span>`;
  if(cant){
    document.getElementById('clVaciar').onclick = () => { cli.carrito = {}; pintarCliente(); };
    document.getElementById('clEnviar').onclick = enviarPedidoCliente;
  }
}

function enviarPedidoCliente(){
  const m = cli.mesa;
  let c = cuentaDe(m.id);
  if(!c){
    c = { id:nuevoId(), mesas:[m.id], comensales:m.capacidad, mozo:'Nico',
          abierta:Date.now(), cuentaPedida:null, comandas:[] };
    CUENTAS.push(c);
    m.pendienteLimpieza = false;
  }
  const ronda = Math.max(0, ...c.comandas.map(k => k.ronda)) + 1;
  const porDestino = {};
  Object.keys(cli.carrito).forEach(id => {
    const p = prod(id);
    (porDestino[p.destino] = porDestino[p.destino] || []).push({
      id:nuevoId(), pid:id, cant:cli.carrito[id], precio:p.precio, acl:'', estado:'pendiente'
    });
  });
  Object.keys(porDestino).forEach(d => {
    c.comandas.push({ id:nuevoId(), destino:d, ronda, estado:'pendiente_aprobacion',
      origen:'qr', creada:Date.now(), enviada:null, items:porDestino[d] });
  });
  cli.carrito = {}; cli.enviado = true; cli.vista = 'mesa';
  document.getElementById('clCambiar').textContent = 'Ver la carta';
  pintarCliente();
  tostar('Pedido enviado. Espera la confirmación de la caja.');
}

function abrirQR(){
  document.getElementById('vistaSalon').hidden = true;
  document.getElementById('vistaQR').hidden = false;
  const local = location.protocol === 'file:';
  document.getElementById('qrAclara').innerHTML = local
    ? `<b>Estos códigos todavía no se pueden escanear.</b> Apuntan a un archivo de tu computadora,
       y el celular no tiene cómo llegar ahí. Subí el archivo a una dirección de internet
       y volvé a entrar acá: los códigos se regeneran solos apuntando a donde esté publicado.`
    : `Imprimí esta hoja, recortá y pegá un código en cada mesa. Si alguien empieza a pedir
       desde afuera del local, se cambia el código de esa mesa y el viejo deja de servir.`;
  document.getElementById('qrGrilla').innerHTML = MESAS.map(m => `
    <div class="qr-carta">
      <div class="lugar">${LOCAL.nombre}</div>
      <div class="n">Mesa ${m.numero}</div>
      ${QR.svg(urlMesa(m.numero), '100%')}
      <div class="pie">Escaneá para ver la carta<br>y pedir desde tu mesa</div>
    </div>`).join('');
}
document.getElementById('btnVolverDeQR').onclick = () => {
  document.getElementById('vistaQR').hidden = true;
  document.getElementById('vistaSalon').hidden = false;

};
document.getElementById('btnImprimirQR').onclick = () => window.print();

const dn = { solapa:'carta', busca:'', rubro:'todos' };

  ['vistaPedido','vistaCocina','vistaCobro','vistaQR','vistaCliente'].forEach(v =>
    document.getElementById(v).hidden = true);
  document.getElementById('vistaSalon').hidden = true;
  document.getElementById('vistaDueno').hidden = false;

}
document.getElementById('btnVolverDeDueno').onclick = () => {
  document.getElementById('vistaDueno').hidden = true;
  document.getElementById('vistaSalon').hidden = false;
  pintar();
};

function pintarDueno(){
  document.getElementById('dnSolapas').innerHTML =
    [['carta','La carta'],['mesas','Mesas y sectores'],['local','Datos del local']]
      .map(([k,t]) => `<button class="chip" data-s="${k}" aria-pressed="${dn.solapa===k}">${t}</button>`).join('');

  else if(dn.solapa === 'mesas') pintarDnMesas();

/* ── La carta ─────────────────────────────────────────────── */
function pintarDnCarta(){
  document.getElementById('dnBarra').innerHTML = `
    <input type="search" class="busq" id="dnBusca" placeholder="Buscar plato" value="${dn.busca}" autocomplete="off">
    <select id="dnRubro" style="height:44px;padding:0 11px;font-size:16px;background:var(--fondo);color:var(--texto);border:1px solid var(--borde);border-radius:9px">
      <option value="todos">Todos los rubros</option>
      ${RUBROS.map(r => `<option value="${r}" ${dn.rubro===r?'selected':''}>${r}</option>`).join('')}
    </select>
    <div class="sep"></div>
    <button class="btn" id="dnAjustar">Ajustar precios</button>
    <button class="btn" id="dnBajar">Descargar la carta</button>
    <button class="btn lleno" id="dnNuevo">Plato nuevo</button>`;

  const bu = document.getElementById('dnBusca');
  bu.oninput = e => { dn.busca = e.target.value; pintarDnCartaLista(); };
  document.getElementById('dnRubro').onchange = e => { dn.rubro = e.target.value; pintarDnCartaLista(); };
  document.getElementById('dnNuevo').onclick = nuevoPlato;
  document.getElementById('dnAjustar').onclick = ajustarPrecios;
  document.getElementById('dnBajar').onclick = descargarCarta;

  pintarDnCartaLista();
}

function pintarDnCartaLista(){
  const q = sinTildes(dn.busca.trim());
  const visibles = CARTA.filter(p => !p.baja
    && (dn.rubro === 'todos' || p.rubro === dn.rubro)
    && (!q || sinTildes(p.nom).includes(q)));

  const cabecera = `<div class="dn-fila cab">
    <span>Plato</span><span>Rubro</span><span>Se prepara en</span>
    <span style="text-align:right">Precio</span><span>Stock</span><span></span></div>`;

  const fila = p => `<div class="dn-fila ${p.agotado?'agotado':''}">
    <input type="text" value="${p.nom.replace(/"/g,'&quot;')}" data-nom="${p.id}">
    <select data-rubro="${p.id}">${RUBROS.map(r => `<option ${p.rubro===r?'selected':''}>${r}</option>`).join('')}</select>
    <select data-dest="${p.id}">${Object.keys(DESTINOS).map(d =>
      `<option value="${d}" ${p.destino===d?'selected':''}>${DESTINOS[d]}</option>`).join('')}</select>
    <input type="number" value="${Math.round(p.precio/100)}" step="100" min="0" data-precio="${p.id}">
    <button class="dn-marca ${p.agotado?'si':''}" data-agot="${p.id}">${p.agotado?'Agotado':'Hay'}</button>
    <button class="dn-borrar" data-baja="${p.id}" aria-label="Sacar de la carta">✕</button>
  </div>`;

  let html = `<p class="dn-nota">Los cambios se ven al instante en la carta del cliente y en la caja.
    El precio se escribe en pesos, sin puntos. Sacar un plato de la carta no borra las cuentas viejas:
    lo que ya se cobró queda con el precio que tenía ese día.</p>`;

  if(!visibles.length){
    html += `<div class="nada"><p>Ningún plato coincide.</p><small>Probá con otra palabra o cambiá el rubro.</small></div>`;
  } else if(dn.rubro === 'todos' && !q){
    RUBROS.forEach(r => {
      const lista = visibles.filter(p => p.rubro === r);
      if(!lista.length) return;
      html += `<div class="dn-rubro">${r} · ${lista.length}</div>${cabecera}${lista.map(fila).join('')}`;
    });
  } else {
    html += cabecera + visibles.map(fila).join('');
  }
  const cont = document.getElementById('dnCuerpo');
  cont.innerHTML = html;

  cont.querySelectorAll('[data-nom]').forEach(i =>
    i.onchange = e => { prod(i.dataset.nom).nom = e.target.value.trim() || 'Sin nombre'; });
  cont.querySelectorAll('[data-precio]').forEach(i =>
    i.onchange = e => { prod(i.dataset.precio).precio = Math.max(0, Math.round(Number(e.target.value)||0)) * 100; });
  cont.querySelectorAll('[data-rubro]').forEach(i =>
    i.onchange = e => { prod(i.dataset.rubro).rubro = e.target.value; pintarDnCartaLista(); });
  cont.querySelectorAll('[data-dest]').forEach(i =>
    i.onchange = e => { prod(i.dataset.dest).destino = e.target.value; });
  cont.querySelectorAll('[data-agot]').forEach(b => b.onclick = () => {
    const p = prod(b.dataset.agot);
    p.agotado = !p.agotado;
    pintarDnCartaLista();
    tostar(p.agotado ? p.nom + ' queda marcado como agotado.' : p.nom + ' vuelve a la carta.');
  });
  cont.querySelectorAll('[data-baja]').forEach(b => b.onclick = () => {
    const p = prod(b.dataset.baja);
    abrirModal({
      titulo:'Sacar de la carta', texto:'“' + p.nom + '” deja de aparecer. Las cuentas viejas no cambian.',
      opciones:['Ya no lo hacemos','Estaba cargado dos veces','Es de temporada','Otro'],
      boton:'Sacar', peligro:true,
      alConfirmar(){ p.baja = true; pintarDnCartaLista(); tostar('Sacado de la carta.'); }
    });
  });
}

function nuevoPlato(){
  const id = 'n' + (++idSeq);
  CARTA.push({ id, nom:'Plato nuevo', precio:0, destino:'coc',
    rubro: dn.rubro === 'todos' ? RUBROS[0] : dn.rubro });
  dn.busca = '';
  pintarDnCarta();
  setTimeout(() => {
    const i = document.querySelector(`[data-nom="${id}"]`);
    if(i){ i.scrollIntoView({block:'center'}); i.focus(); i.select(); }
  }, 30);
}

function ajustarPrecios(){
  abrirModal({
    titulo:'Ajustar precios',
    texto:'Sube o baja de una vez todos los precios ' +
      (dn.rubro === 'todos' ? 'de la carta' : 'del rubro ' + dn.rubro) +
      '. Redondea a los 100 pesos más cercanos.',
    opciones:['+5%','+8%','+10%','+15%','−5%','−10%'],
    pin:true,
    boton:'Aplicar',
    alConfirmar(v){
      const pct = Number(v.replace('−','-').replace('%','').replace('+',''));
      const tocados = CARTA.filter(p => !p.baja && (dn.rubro === 'todos' || p.rubro === dn.rubro));
      tocados.forEach(p => {
        p.precio = Math.max(0, Math.round(p.precio * (1 + pct/100) / 10000) * 10000);
      });
      pintarDnCartaLista();
      tostar(tocados.length + ' precios ajustados ' + v + '. Las cuentas abiertas mantienen el precio viejo.');
    }
  });
}

function descargarCarta(){
  const linea = p => `  { id:'${p.id}', nom:${JSON.stringify(p.nom)}, precio:${p.precio}, ` +
    `destino:'${p.destino}', rubro:${JSON.stringify(p.rubro)}${p.agotado?', agotado:true':''} }`;
  const txt =
`/* Carta de ${LOCAL.nombre}, exportada el ${new Date().toLocaleString('es-AR',{hour12:false})}.
   Pegá estos tres bloques dentro de salon.html, reemplazando los que ya están. */

const LOCAL = ${JSON.stringify(LOCAL, null, 2)};

const RUBROS = ${JSON.stringify(RUBROS)};

const CARTA = [
${CARTA.filter(p => !p.baja).map(linea).join(',\n')}
];

const MESAS = [
${MESAS.map(m => `  { id:${m.id}, numero:${m.numero}, capacidad:${m.capacidad}, sector:${JSON.stringify(m.sector)} }`).join(',\n')}
];
`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type:'text/plain;charset=utf-8'}));
  a.download = 'carta-' + LOCAL.nombre.toLowerCase().replace(/[^a-z0-9]+/g,'-') + '.txt';
  a.click();
  URL.revokeObjectURL(a.href);
  tostar('Carta descargada. Pegala en el archivo para que quede fija.');
}

/* ── Mesas ────────────────────────────────────────────────── */
function pintarDnMesas(){
  document.getElementById('dnBarra').innerHTML = `
    <span style="color:var(--texto-medio);font-size:16px">${MESAS.length} mesas en ${[...new Set(MESAS.map(m=>m.sector))].length} sectores</span>
    <div class="sep"></div>
    <button class="btn lleno" id="dnMesaNueva">Agregar mesa</button>`;
  document.getElementById('dnMesaNueva').onclick = () => {
    const num = Math.max(0, ...MESAS.map(m => m.numero)) + 1;
    MESAS.push({ id:Math.max(...MESAS.map(m=>m.id))+1, numero:num, capacidad:4,
      sector:MESAS[0].sector, pendienteLimpieza:false });
    pintarDnMesas();
    tostar('Mesa ' + num + ' agregada. Su código QR ya está listo.');
  };

  const sectores = [...new Set(MESAS.map(m => m.sector))];
  let html = `<p class="dn-nota">Cada mesa tiene su propio código QR, que se genera solo a partir del número.
    Si cambiás el número de una mesa, hay que imprimir de nuevo su código.</p>
    <div class="dn-fila mesas cab"><span>Número</span><span>Lugares</span><span>Sector</span><span></span></div>`;

  MESAS.forEach(m => {
    const ocupada = !!cuentaDe(m.id);
    html += `<div class="dn-fila mesas">
      <input type="number" value="${m.numero}" min="1" data-mnum="${m.id}">
      <input type="number" value="${m.capacidad}" min="1" data-mcap="${m.id}">
      <input type="text" value="${m.sector}" list="sectores" data-msec="${m.id}">
      <button class="dn-borrar" data-mbaja="${m.id}" ${ocupada?'disabled style="opacity:.3"':''}
        aria-label="Quitar mesa">✕</button>
    </div>`;
  });
  html += `<datalist id="sectores">${sectores.map(s => `<option value="${s}">`).join('')}</datalist>`;

  const cont = document.getElementById('dnCuerpo');
  cont.innerHTML = html;
  const mesa = id => MESAS.find(m => m.id === Number(id));
  cont.querySelectorAll('[data-mnum]').forEach(i => i.onchange = e => {
    const n = Math.max(1, Math.round(Number(e.target.value)||1));
    if(MESAS.some(m => m.numero === n && m.id !== Number(i.dataset.mnum))){
      tostar('Ya hay una mesa con ese número.'); pintarDnMesas(); return;
    }
    mesa(i.dataset.mnum).numero = n; pintarDnMesas();
  });
  cont.querySelectorAll('[data-mcap]').forEach(i =>
    i.onchange = e => { mesa(i.dataset.mcap).capacidad = Math.max(1, Math.round(Number(e.target.value)||1)); });
  cont.querySelectorAll('[data-msec]').forEach(i =>
    i.onchange = e => { mesa(i.dataset.msec).sector = e.target.value.trim() || 'Salón'; pintarDnMesas(); });
  cont.querySelectorAll('[data-mbaja]').forEach(b => b.onclick = () => {
    const m = mesa(b.dataset.mbaja);
    if(cuentaDe(m.id)){ tostar('Esa mesa tiene una cuenta abierta.'); return; }
    MESAS.splice(MESAS.indexOf(m), 1);
    pintarDnMesas(); tostar('Mesa ' + m.numero + ' quitada.');
  });
}

/* ── Modal genérico ─────────────────────────────────────── */
let elegidoModal = null;
function abrirModal(cfg){
  elegidoModal = null;
  const caja = document.getElementById('cajaModal');
  caja.innerHTML = `<h3>${cfg.titulo}</h3><p>${cfg.texto}</p>
    <div class="opciones" id="ops">${cfg.opciones.map(o => `<button data-op="${o}">${o}</button>`).join('')}</div>
    <div id="libre" style="display:none"><input type="text" id="txtLibre" placeholder="Escribí el motivo"></div>
    ${cfg.pin ? `<label for="pin">PIN de cajero</label><input type="text" id="pin" class="pin" inputmode="numeric" maxlength="4" placeholder="••••" value="1234">` : ''}
    <div class="botonera">
      <button class="btn" id="mCancelar">Cancelar</button>
      <button class="btn ${cfg.peligro?'mal':'lleno'}" id="mOk" disabled>${cfg.boton}</button>
    </div>`;
  document.getElementById('modal').classList.add('abierto');

  const ok = document.getElementById('mOk');
  caja.querySelectorAll('#ops button').forEach(b => b.onclick = () => {
    caja.querySelectorAll('#ops button').forEach(x => x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
    elegidoModal = b.dataset.op;
    document.getElementById('libre').style.display = elegidoModal === 'Otro' ? 'block' : 'none';
    ok.disabled = false;
  });
  document.getElementById('mCancelar').onclick = cerrarModal;
  ok.onclick = () => {
    let v = elegidoModal;
    if(v === 'Otro'){
      const t = document.getElementById('txtLibre').value.trim();
      if(!t){ tostar('Escribí el motivo.'); return; }
      v = t;
    }
    cerrarModal();
    cfg.alConfirmar(v);
  };
}
function cerrarModal(){ document.getElementById('modal').classList.remove('abierto'); }

/* ── Aviso flotante ───────────────────────────────────────── */
let relojTostada;
function tostar(txt){
  const t = document.getElementById('tostada');
  t.textContent = txt;
  t.classList.add('visible');
  clearTimeout(relojTostada);
  relojTostada = setTimeout(() => t.classList.remove('visible'), 3600);
}

/* ── Red simulada ─────────────────────────────────────────── */
document.getElementById('btnRed').onclick = () => {
  ui.enLinea = !ui.enLinea;
  const b = document.getElementById('btnRed');
  b.classList.toggle('off', !ui.enLinea);
  document.getElementById('txtRed').textContent = ui.enLinea ? 'En línea' : 'Sin internet';
  if(ui.enLinea && ui.enCola){
    tostar('Volvió internet. Se sincronizaron ' + ui.enCola + ' comandas.');
    ui.enCola = 0;
  }
  pintar();
};

/* ── Reloj y tiempos ──────────────────────────────────────── */
function tick(){
  const h = new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false});
  document.getElementById('reloj').textContent = h;
  document.getElementById('relojCocina').textContent = h;
  document.getElementById('relojCobro').textContent = h;
  document.getElementById('relojDueno').textContent = h;
}
setInterval(() => {
  if(!document.getElementById('vistaCocina').hidden) pintarCocina();
  else contadorCocina();
}, 15000);
tick();
setInterval(tick, 20000);
setInterval(() => { if(ui.modo === 'normal') pintar(); }, 30000);

/* ── Vida propia: entra un pedido por QR ──────────────────── */
setTimeout(() => {
  if(!ui.enLinea) return;
  const c = CUENTAS.find(x => x.id === 'c4');
  c.comandas.push({
    id:nuevoId(), destino:'coc', ronda:2, estado:'pendiente_aprobacion',
    origen:'qr', creada:Date.now(), enviada:null,
    items:[
      { id:nuevoId(), pid:'p10', cant:2, precio:650000, acl:'', estado:'pendiente' },
      { id:nuevoId(), pid:'p12', cant:1, precio:820000, acl:'bien crocantes', estado:'pendiente' }
    ]
  });
  pintar();
  tostar('Entró un pedido por QR de la mesa 7.');
}, 9000);

/* ── Arranque ─────────────────────────────────────────────
   Si la dirección trae ?m=NUMERO&t=TOKEN, esto es el celular
   de un cliente que escaneó el QR de esa mesa. */
(function arrancar(){
  document.getElementById('nombreLocal').textContent = LOCAL.nombre;
  document.getElementById('nombreLocal2').textContent = LOCAL.nombre;
  document.title = LOCAL.nombre;

  const q = new URLSearchParams(location.search);
  const num = Number(q.get('m')), tok = q.get('t');
  if(num && tok){
    const m = MESAS.find(x => x.numero === num);
    if(m && tok === tokenDe(num)){ pintar(); abrirCliente(num); return; }
    document.body.innerHTML = `<div class="nada" style="padding-top:80px">
      <p>Este código no es válido.</p>
      <small>Puede que hayan cambiado el código de la mesa. Pedile la carta al mozo.</small></div>`;
    return;
  }
  pintar();
})();
</script>
